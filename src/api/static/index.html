<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Replaced by the server with its root path, so a reverse proxy can
     mount the app under any prefix. Every URL below is RELATIVE. -->
<base href="__BASE__">
<title>Nodi Tech Assistant</title>
<style>
  /* No external fonts or CDNs anywhere: the project must work offline. */
  :root{
    --bg:#faf9f5; --side:#f0eee6; --raise:#ffffff; --bubble:#efece3;
    --ink:#262521; --ink-2:#4a4740; --muted:#736e64;
    --line:#e4e0d6; --line-2:#edeae1;
    --accent:#262521; --accent-ink:#faf9f5; --active:#e6e2d7;
    --warn:#8a6412; --warn-bg:#fbf4e4; --warn-line:#e6d6ae;
    --err:#8f2a33; --err-bg:#fbeeef; --err-line:#e8ccd0;
    --ok:#3f7d5c;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#262624; --side:#1d1d1b; --raise:#30302e; --bubble:#3a3a37;
      --ink:#f0eee6; --ink-2:#cfccc3; --muted:#948f85;
      --line:#3a3a37; --line-2:#323230;
      --accent:#f0eee6; --accent-ink:#262624; --active:#35352f;
      --warn:#d9b872; --warn-bg:#2c2518; --warn-line:#4a3f26;
      --err:#e8a0a8; --err-bg:#2e1b1d; --err-line:#4d2d31;
      --ok:#6cb892;
    }
  }
  :root[data-theme="dark"]{
    --bg:#262624; --side:#1d1d1b; --raise:#30302e; --bubble:#3a3a37;
    --ink:#f0eee6; --ink-2:#cfccc3; --muted:#948f85;
    --line:#3a3a37; --line-2:#323230;
    --accent:#f0eee6; --accent-ink:#262624; --active:#35352f;
    --warn:#d9b872; --warn-bg:#2c2518; --warn-line:#4a3f26;
    --err:#e8a0a8; --err-bg:#2e1b1d; --err-line:#4d2d31;
    --ok:#6cb892;
  }

  *{box-sizing:border-box;}
  /* This is an app shell, not a document: the window itself must never
     scroll. Without this the page can gain its OWN scrollbar beside the
     thread's, and scrolling it carries the composer off the bottom of the
     screen -- two scrollbars, one of which breaks the layout. The only
     scrolling region is `.scroll`. */
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;}
  body{
    background:var(--bg); color:var(--ink);
    font:15.5px/1.7 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,
         "Helvetica Neue",Arial,"Noto Sans Bengali",sans-serif;
    letter-spacing:-.003em; -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
  [hidden]{display:none !important;}

  .app{display:flex;height:100%;overflow:hidden;}
  /* Progressive: dvh follows mobile browser chrome as it shows and hides,
     where 100% of a `height:100%` body can be stale by the toolbar's height.
     Ignored by anything that does not understand it. */
  @supports (height:100dvh){ .app{height:100dvh;} }

  /* ----------------------------------------------------------- sidebar  */
  .sidebar{
    width:262px;flex:none;background:var(--side);
    display:flex;flex-direction:column;min-height:0;
    border-right:1px solid var(--line);
  }
  .side-head{padding:15px 13px 8px;}
  .side-top{display:flex;align-items:center;gap:6px;padding:0 1px 12px;}
  .side-top .brand{flex:1;padding:0;}
  /* Collapse toggle: compact, but a full 34px hit target so it is easy to
     reach at the very top-left corner of the window. */
  .panelbtn{
    width:34px;height:34px;flex:none;display:grid;place-items:center;
    border:1px solid var(--line);background:var(--raise);color:var(--ink-2);
    border-radius:9px;cursor:pointer;
  }
  .panelbtn:hover{border-color:var(--muted);color:var(--ink);}
  .panelbtn svg{width:17px;height:17px;}
  /* Collapsed: the sidebar is removed on every width, and the same control
     reappears in the top bar so it can be brought back. */
  .app.nosidebar .sidebar{display:none;}
  .app.nosidebar #burger{display:grid;}
  .brand{
    display:flex;align-items:center;gap:9px;padding:0 5px 14px;
    font-size:13.5px;font-weight:600;letter-spacing:-.01em;
  }
  /* The brand mark is the same document-and-lens used on the home screen,
     so the product has ONE mark. It keeps its filled tile: that is what
     separates the brand row from the outline nav icons under it. 24px is
     the smallest tile at which the lens is still legible -- measured, not
     guessed, by rendering it. */
  .brand i{
    width:24px;height:24px;border-radius:6px;flex:none;display:grid;
    place-items:center;background:var(--ink);color:var(--bg);
    font-style:normal;
  }
  .brand i svg{width:15px;height:15px;}
  .navbtn{
    width:100%;display:flex;align-items:center;gap:9px;
    background:transparent;border:1px solid transparent;color:var(--ink-2);
    border-radius:8px;padding:8px 11px;cursor:pointer;
    font-size:13.5px;font-weight:500;text-align:left;margin-bottom:3px;
  }
  .navbtn:hover{background:var(--active);color:var(--ink);}
  .navbtn.primary{border-color:var(--line);color:var(--ink);}
  .navbtn.primary:hover{background:var(--raise);border-color:var(--muted);}
  .navbtn.on{background:var(--active);color:var(--ink);font-weight:550;}
  .navbtn svg{width:15px;height:15px;opacity:.75;flex:none;}

  .convos{flex:1;overflow-y:auto;padding:4px 9px 14px;min-height:0;}
  .grouplabel{
    font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;
    text-transform:uppercase;padding:14px 8px 5px;
  }
  .convo{
    display:flex;align-items:center;gap:6px;width:100%;
    padding:7px 9px;border-radius:7px;cursor:pointer;
    border:0;background:transparent;text-align:left;
    font-size:13.5px;color:var(--ink-2);line-height:1.45;
  }
  .convo:hover{background:var(--active);}
  .convo.active{background:var(--active);color:var(--ink);font-weight:500;}
  .convo span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .convo .del{
    width:20px;height:20px;flex:none;border:0;background:transparent;
    color:var(--muted);border-radius:4px;cursor:pointer;display:none;place-items:center;
  }
  .convo:hover .del{display:grid;}
  .convo .del:hover{color:var(--err);}
  .convo .del svg{width:12px;height:12px;}
  .empty-note{font-size:12.5px;color:var(--muted);padding:12px 9px;}

  .side-foot{
    border-top:1px solid var(--line);padding:10px 16px;
    font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none;}
  .dot.bad{background:#b4454f;}

  /* -------------------------------------------------------------- main  */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
  .topbar{
    height:50px;flex:none;display:flex;align-items:center;gap:10px;
    padding:0 18px;border-bottom:1px solid transparent;
  }
  .topbar.scrolled{border-bottom-color:var(--line);}
  .topbar h1{
    font-size:14px;font-weight:550;margin:0;letter-spacing:-.01em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .grow{flex:1;}
  .ghost{
    width:30px;height:30px;display:grid;place-items:center;border-radius:7px;
    border:0;background:transparent;color:var(--muted);cursor:pointer;
  }
  .ghost:hover{background:var(--active);color:var(--ink);}
  .ghost svg{width:15px;height:15px;}
  #burger{display:none;}
  .scrim{display:none;}
  @media (max-width:860px){ .scrim{display:block;} }

  /* `contain` stops a flick past the end of the thread from being handed
     on to an ancestor -- the chaining that makes a page feel like it has a
     second scroller even when it has not. */
  /* `position:relative` is the ROOT fix for the second scrollbar. Every
     bubble carries a `.sr` label, which is `position:absolute`; with no
     positioned ancestor each one resolved against the DOCUMENT, at its
     static position far down a long thread. Absolutely positioned boxes
     extend their containing block's scrollable area, so the document grew
     its own scrollbar and dragged the whole shell -- composer included.
     Anchoring them here keeps that overflow inside the region that is
     supposed to scroll. Measured positions use getBoundingClientRect, never
     offsetTop, so adding a positioned ancestor cannot shift the maths. */
  .scroll{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain;
          position:relative;}
  .thread{max-width:740px;margin:0 auto;padding:22px 28px 12px;}
  /* Height is set from JS; it is pure empty space, never focusable or
     selectable, so it cannot be tabbed into or caught by a text selection. */
  .tailpad{height:0;flex:none;pointer-events:none;user-select:none;}

  /* A newly posted turn eases in rather than snapping into place. The
     animation is on the BUBBLE, never on `.turn`: a transform on the turn
     would move its bounding rect, and that rect is what the parking maths
     measures. Transforming a child cannot change the parent's layout box,
     so the geometry stays exact while the motion stays visible. */
  @keyframes risein{
    from{opacity:0;transform:translateY(7px);}
    to{opacity:1;transform:none;}
  }
  .turn.fresh .bubble{animation:risein .24s cubic-bezier(.22,.7,.3,1) both;}
  @media (prefers-reduced-motion: reduce){
    .turn.fresh .bubble{animation:none;}
  }

  /* ------------------------------------------------------ home screen  */
  /* With no conversation open the composer moves into the centre of the
     page, under a title, instead of sitting pinned at the bottom. */
  .main.home .scroll{display:flex;flex-direction:column;justify-content:center;}
  .home-block{max-width:740px;margin:0 auto;width:100%;padding:0 28px 40px;}
  .home-title{
    display:flex;align-items:center;justify-content:center;gap:13px;
    margin:0 0 26px;font-size:30px;font-weight:450;letter-spacing:-.025em;
  }
  .home-title svg{width:27px;height:27px;flex:none;color:var(--muted);}
  .home-sub{text-align:center;color:var(--muted);font-size:14px;margin:-16px 0 26px;}
  #starters{margin-top:20px;}
  .starter{
    display:block;width:100%;text-align:left;background:transparent;
    border:0;border-top:1px solid var(--line-2);padding:11px 2px;cursor:pointer;
    font-size:14.5px;color:var(--ink-2);
  }
  .starter:last-child{border-bottom:1px solid var(--line-2);}
  .starter:hover{color:var(--ink);}

  /* ------------------------------------------------------------- turns  */
  .turn{display:flex;margin-bottom:28px;}
  .turn.user{justify-content:flex-end;}
  .bubble{min-width:0;}
  .turn.user .bubble{
    background:var(--bubble);border-radius:16px;padding:11px 16px;
    max-width:80%;color:var(--ink);
  }
  .turn.bot .bubble{max-width:100%;width:100%;}
  .text{white-space:pre-wrap;overflow-wrap:anywhere;}
  .text.err{
    background:var(--err-bg);border:1px solid var(--err-line);color:var(--err);
    border-radius:10px;padding:11px 13px;
  }
  .note{
    background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);
    border-radius:9px;padding:9px 12px;font-size:12.5px;margin-top:10px;
  }
  .caret{
    display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;
    background:var(--ink-2);opacity:.7;animation:blink 1.05s steps(2,start) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  /* ----------------------------------------------------------- sources  */
  /* Chips, not a run-on sentence. A reader should see at a glance HOW MANY
     documents an answer rests on, and spot a superseded one without having
     to read to the end of a line. */
  .sources{margin-top:13px;padding-top:11px;border-top:1px solid var(--line-2);}
  .sources-head{
    display:flex;align-items:center;gap:6px;margin-bottom:7px;
    font-size:10px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;
    color:var(--muted);
  }
  .sources-head svg{width:11px;height:11px;opacity:.7;flex:none;}
  .sources-head .count{
    font-size:9.5px;font-weight:600;letter-spacing:0;text-transform:none;
    background:var(--active);color:var(--ink-2);
    border-radius:999px;padding:0 6px;
  }
  .srcs{display:flex;flex-wrap:wrap;gap:6px;}
  .src{
    display:inline-flex;align-items:center;gap:6px;max-width:100%;
    border:1px solid var(--line);border-radius:7px;background:var(--raise);
    padding:4px 9px 4px 7px;font-size:11.5px;color:var(--ink-2);line-height:1.3;
  }
  .src svg{width:11px;height:11px;flex:none;opacity:.55;}
  .src .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .src .tag{
    flex:none;font-size:9px;font-weight:600;letter-spacing:.02em;
    border-radius:4px;padding:0 5px;text-transform:uppercase;
    background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);
  }
  .src.sup{border-color:var(--warn-line);}
  .src.sup svg{opacity:.8;color:var(--warn);}

  /* ------------------------------------------------- process inspector  */
  .proc{margin-top:13px;}
  .proc-bar{display:flex;align-items:center;gap:9px;}
  .ring{
    width:13px;height:13px;flex:none;border-radius:50%;
    border:1.5px solid var(--line);border-top-color:var(--muted);
    animation:spin .65s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .proc-label{font-size:14.5px;color:var(--muted);}
  .proc-clock{
    font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;
    margin-left:-3px;
  }
  .proc-done .proc-clock{display:none;}

  /* info tooltip in the sidebar footer */
  .info{
    position:relative;width:16px;height:16px;flex:none;display:grid;
    place-items:center;border:1px solid var(--line);border-radius:50%;
    background:transparent;color:var(--muted);cursor:help;font-size:9.5px;
    font-weight:700;line-height:1;padding:0;
  }
  .info:hover{color:var(--ink);border-color:var(--muted);}
  .info .tip{
    position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);
    width:238px;padding:9px 11px;border-radius:9px;z-index:60;
    background:var(--raise);border:1px solid var(--line);color:var(--ink-2);
    font-size:11.5px;font-weight:400;line-height:1.5;text-align:left;
    letter-spacing:0;cursor:default;
    box-shadow:0 6px 24px rgba(0,0,0,.18);
    opacity:0;visibility:hidden;transition:opacity .12s;
  }
  .info:hover .tip,.info:focus-visible .tip{opacity:1;visibility:visible;}
  .proc-done .proc-label{font-size:11.5px;}
  .proc-toggle{
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    background:transparent;border:1px solid var(--line);border-radius:999px;
    color:var(--muted);padding:3px 9px 3px 7px;font-size:11.5px;
  }
  .proc-toggle:hover{color:var(--ink);border-color:var(--muted);}
  .proc-toggle svg{width:12px;height:12px;flex:none;}
  .proc-toggle .chev{transition:transform .15s;}
  .proc-toggle[aria-expanded="true"] .chev{transform:rotate(180deg);}

  .steps{
    list-style:none;margin:11px 0 0;padding:11px 0 2px;
    border-top:1px solid var(--line-2);
  }
  .step{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:13px;}
  .step .mark{
    width:15px;height:15px;flex:none;margin-top:3px;border-radius:50%;
    display:grid;place-items:center;font-size:9px;
    border:1.5px solid var(--line);color:var(--muted);
  }
  .step.done .mark{border-color:var(--ok);color:var(--ok);}
  .step.live .mark{border-color:var(--muted);border-top-color:transparent;
                   animation:spin .65s linear infinite;}
  .step.pending{color:var(--muted);}
  .step.pending .mark{opacity:.5;}
  .step .body{flex:1;min-width:0;}
  .step .name{color:var(--ink-2);}
  .step.pending .name{color:var(--muted);}
  .step .detail{font-size:12px;color:var(--muted);margin-top:1px;
                overflow-wrap:anywhere;}
  .step .ms{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
            flex:none;margin-top:1px;}

  /* Message clock. Inside the bubble so it travels with the message and
     needs no change to the flex row that aligns user turns right. */
  .stamp{
    font-size:10.5px;color:var(--muted);margin-top:5px;
    font-variant-numeric:tabular-nums;letter-spacing:.01em;
  }
  .turn.user .stamp{text-align:right;opacity:.85;}
  .stamp:empty{display:none;}

  /* The step name and its own collapse control share a row. */
  .step .nrow{display:flex;align-items:center;gap:7px;}
  .step .nrow .name{flex:1;min-width:0;}
  .substoggle{
    width:18px;height:18px;flex:none;display:grid;place-items:center;padding:0;
    border:1px solid var(--line);border-radius:5px;background:transparent;
    color:var(--muted);cursor:pointer;
  }
  .substoggle:hover{color:var(--ink);border-color:var(--muted);}
  .substoggle svg{width:10px;height:10px;transition:transform .15s;}
  .substoggle[aria-expanded="true"] svg{transform:rotate(180deg);}
  .step.pending .substoggle{display:none;}

  /* Sub-steps: the real work inside one step, each with its own state and
     its own measured duration. Indented behind a rail so the four top-level
     steps still read as the outline. */
  .substeps{
    list-style:none;margin:6px 0 3px;padding:0 0 0 11px;
    border-left:1px solid var(--line-2);
  }
  .substep{
    display:flex;gap:8px;align-items:flex-start;padding:2.5px 0;
    font-size:12px;color:var(--muted);
  }
  .substep .smark{
    width:11px;height:11px;flex:none;margin-top:3.5px;border-radius:50%;
    border:1.5px solid var(--line);display:grid;place-items:center;
    font-size:7.5px;line-height:1;
  }
  .substep.done{color:var(--ink-2);}
  .substep.done .smark{border-color:var(--ok);color:var(--ok);}
  .substep.live{color:var(--ink-2);}
  .substep.live .smark{
    border-color:var(--muted);border-top-color:transparent;
    animation:spin .65s linear infinite;
  }
  .substep.skip{opacity:.6;}
  .substep.skip .smark{border-style:dashed;}
  .substep .sbody{flex:1;min-width:0;overflow-wrap:anywhere;}
  .substep .sval{color:var(--muted);}
  /* The named piece of software that does this sub-step. Monospace because
     these are literal model tags and module names, not prose -- a reader
     should be able to paste one into `ollama list` and have it match. */
  .substep .tool{
    display:inline-block;margin:1px 0 1px 6px;padding:0 5px;
    border:1px solid var(--line);border-radius:4px;background:var(--raise);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:9.5px;line-height:15px;color:var(--muted);
    vertical-align:1px;white-space:nowrap;
  }
  .substep.done .tool,.substep.live .tool{color:var(--ink-2);}
  .substep.skip .tool{text-decoration:line-through;opacity:.7;}
  .substep .sms{
    flex:none;font-size:11px;color:var(--muted);
    font-variant-numeric:tabular-nums;margin-top:1px;
  }
  .proc-toggle .n{opacity:.75;}

  /* ---------------------------------------------------------- composer  */
  .composer-wrap{flex:none;padding:8px 28px 18px;}
  .main.home .composer-wrap{padding:0;}
  .composer{
    max-width:740px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;
    border:1px solid var(--line);border-radius:14px;background:var(--raise);
    padding:9px 9px 9px 16px;transition:border-color .12s;
  }
  .main.home .composer{padding:13px 11px 13px 18px;border-radius:16px;}
  .composer:focus-within{border-color:var(--muted);}
  textarea{
    flex:1;border:0;outline:0;resize:none;background:transparent;color:inherit;
    font:inherit;line-height:1.6;padding:6px 0;max-height:192px;min-height:26px;
  }
  textarea::placeholder{color:var(--muted);}
  .send{
    width:31px;height:31px;flex:none;border:0;border-radius:8px;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  }
  .send:disabled{opacity:.25;cursor:not-allowed;}
  .send svg{width:14px;height:14px;}

  /* ---------------------------------------------------- example picker */
  /* Anchors the popover. The composer is MOVED between the home and chat
     views rather than duplicated, so anchoring here follows it to both. */
  .composer{position:relative;}
  .exbtn{
    width:27px;height:27px;flex:none;margin-bottom:2px;padding:0;
    border:1px solid var(--line);border-radius:7px;background:transparent;
    color:var(--muted);cursor:pointer;display:grid;place-items:center;
  }
  .exbtn:hover{color:var(--ink);border-color:var(--muted);}
  .exbtn[aria-expanded="true"]{color:var(--ink);border-color:var(--muted);
    background:var(--active);}
  .exbtn svg{width:14px;height:14px;}

  .expop{
    position:absolute;bottom:calc(100% + 10px);left:0;right:0;z-index:40;
    border:1px solid var(--line);border-radius:13px;background:var(--raise);
    box-shadow:0 12px 34px rgba(0,0,0,.30);
    max-height:min(56vh,430px);overflow:auto;overscroll-behavior:contain;
    padding:6px;
  }
  .expop[hidden]{display:none;}
  .expop .exhead{
    padding:9px 10px 7px;font-size:11px;color:var(--muted);
    border-bottom:1px solid var(--line-2);margin-bottom:4px;
  }
  .exgroup{padding:7px 10px 2px;}
  .exgroup .gname{
    font-size:10px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;
    color:var(--ink-2);
  }
  .exgroup .gwhy{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45;}
  .exq{
    display:block;width:100%;text-align:left;border:0;background:transparent;
    color:var(--ink-2);font:inherit;font-size:12.5px;line-height:1.45;
    padding:6px 10px;border-radius:8px;cursor:pointer;
  }
  .exq:hover,.exq:focus-visible{background:var(--active);color:var(--ink);outline:0;}
  .legal{max-width:740px;margin:8px auto 0;font-size:11px;color:var(--muted);text-align:center;}

  /* ------------------------------------------------------ architecture  */
  .arch{max-width:860px;margin:0 auto;padding:16px 28px 60px;}
  .arch h2{font-size:22px;font-weight:600;margin:14px 0 6px;letter-spacing:-.02em;}
  .arch h3{font-size:13px;font-weight:600;margin:34px 0 12px;color:var(--ink);
           letter-spacing:.03em;text-transform:uppercase;}
  .arch p{color:var(--ink-2);margin:0 0 14px;}
  .arch .lead{font-size:15.5px;}
  .arch table{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 10px;}
  .arch th{
    text-align:left;font-weight:600;font-size:11px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--muted);padding:0 10px 7px 0;
    border-bottom:1px solid var(--line);
  }
  .arch td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line-2);
           vertical-align:top;color:var(--ink-2);}
  .arch td b{color:var(--ink);font-weight:550;}
  .arch code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px;background:var(--active);padding:1px 5px;border-radius:4px;
  }
  .arch .callout{
    border:1px solid var(--line);border-left:3px solid var(--muted);
    border-radius:9px;background:var(--raise);
    padding:13px 16px;margin:0 0 18px;color:var(--ink-2);font-size:14px;
  }
  .arch .callout b{color:var(--ink);font-weight:600;}
  .arch .callout p{margin:0;}
  .arch .callout p+p{margin-top:9px;}
  .arch ol.plain,.arch ul.plain{margin:0 0 16px;padding-left:20px;color:var(--ink-2);}
  .arch ol.plain li,.arch ul.plain li{margin-bottom:9px;padding-left:3px;}
  .arch ol.plain b,.arch ul.plain b{color:var(--ink);font-weight:600;}
  .arch h3 .num{color:var(--muted);margin-right:7px;font-weight:600;}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 6px;}
  .stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .stat b{display:block;font-size:21px;font-weight:550;letter-spacing:-.02em;}
  .stat span{font-size:11.5px;color:var(--muted);}
  @media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr);}}

  /* flow diagram — plain boxes and rules, no drawing library */
  .flow{margin:0 0 6px;}
  .fbox{
    border:1px solid var(--line);border-radius:9px;padding:9px 13px;
    background:var(--raise);font-size:13px;color:var(--ink-2);
  }
  .fbox b{display:block;color:var(--ink);font-weight:550;font-size:13.5px;}
  .fbox small{color:var(--muted);font-size:11.5px;}
  .fbox.key{border-color:var(--muted);}
  .fbox.off{background:transparent;border-style:dashed;}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .farrow{
    height:20px;display:grid;place-items:center;color:var(--muted);
    font-size:11px;line-height:1;
  }
  .farrow::before{content:"↓";}
  .fnote{font-size:11.5px;color:var(--muted);padding:3px 2px 0;}
  .flane{
    font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);margin:26px 0 10px;
  }

  @media (max-width:860px){
    .sidebar{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);
             transition:transform .18s ease;}
    .sidebar.open{transform:none;box-shadow:2px 0 18px rgba(0,0,0,.28);}
    /* A real element, not the box-shadow trick this used to use. A shadow
       dims the page but cannot receive a tap, so the only way out of the
       sidebar was the button. */
    .scrim{
      position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.38);
      opacity:0;transition:opacity .18s ease;
    }
    .scrim.on{opacity:1;}
    #burger{display:grid;}
    .thread,.composer,.legal,.arch,.home-block{max-width:none;}
    .thread,.arch{padding-left:18px;padding-right:18px;}
    .composer-wrap{padding-left:18px;padding-right:18px;}
    .home-block{padding-left:18px;padding-right:18px;}
    .turn.user .bubble{max-width:88%;}
    /* The disclaimer is a footnote, not a headline. At phone width it was
       taking two full lines directly under the input. */
    .legal{font-size:9.5px;line-height:1.35;margin-top:6px;opacity:.85;}
    .home-title{font-size:24px;}
    .frow{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="scrim" id="scrim" hidden></div>

  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="side-top">
        <div class="brand">
          <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
            <path d="M14 2H6.5A2.5 2.5 0 0 0 4 4.5v15A2.5 2.5 0 0 0 6.5 22h11a2.5 2.5 0 0 0 2.5-2.5V8z"/>
            <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
            <circle cx="11.2" cy="14.2" r="3.1"/>

        </button>

        New conversation
      </button>
      <button class="navbtn" id="navarch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="8.5" y="14" width="7" height="7" rx="1.5"/><path d="M6.5 10v2.5h11V10M12 12.5V14"/></svg>
        Architecture

    </div>
    <nav class="convos" id="convos"></nav>
    <div class="side-foot">
      <i class="dot" id="dot"></i><span id="footstat">checking</span>
      <button class="info" id="infobtn" type="button" aria-label="What does this mean?">i
        <span class="tip" id="infotip"></span>

  </aside>

  <div class="main home" id="main">
    <div class="topbar" id="topbar">
      <button class="ghost" id="burger" aria-label="Conversations">

      </button>

      <span class="grow"></span>
      <button class="ghost" id="theme" aria-label="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </div>

    <div class="scroll" id="scroll">

      <!-- home -->
      <div class="home-block" id="homeblock">
        <h2 class="home-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M14 2H6.5A2.5 2.5 0 0 0 4 4.5v15A2.5 2.5 0 0 0 6.5 22h11a2.5 2.5 0 0 0 2.5-2.5V8z"/>
            <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
            <circle cx="11.2" cy="14.2" r="3.1"/>
            <path d="m13.4 16.4 2.2 2.2"/>
          </svg>
          Nodi Tech Assistant
        </h2>
        <p class="home-sub">Answers from the company's internal documents, with sources.</p>
        <div id="composerslot"></div>
        <div id="starters"></div>
      </div>

      <!-- conversation -->
      <div class="thread" id="thread" hidden>
        <div id="log"></div>
        <!-- Reserved room below the newest question so it can sit at the top
             of the viewport while the answer streams in underneath it. -->

      <!-- architecture -->
      <div class="arch" id="arch" hidden></div>
    </div>

    <div class="composer-wrap" id="composerwrap">
      <form class="composer" id="form">
        <button class="exbtn" id="exbtn" type="button" aria-expanded="false"
                aria-haspopup="true" aria-controls="expop"
                title="What can I ask?" aria-label="What can I ask?"></button>
        <textarea id="q" rows="1" placeholder="How can I help you today?"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send"></button>
        <div class="expop" id="expop" hidden role="dialog"
             aria-label="Example questions"></div>
      </form>
      <div class="legal" id="legal">Answers are drawn from internal documents and may be incomplete. Verify anything consequential.</div>

</div>

<script>
'use strict';

const $ = id => document.getElementById(id);
const main=$('main'), log=$('log'), thread=$('thread'), homeblock=$('homeblock'),
      arch=$('arch'), scroll=$('scroll'), topbar=$('topbar'),
      form=$('form'), input=$('q'), sendBtn=$('send'), legal=$('legal'),
      composerWrap=$('composerwrap'), composerSlot=$('composerslot'),
      convosEl=$('convos'), threadTitle=$('threadtitle'), sidebar=$('sidebar'),
      tailpad=$('tailpad');

let conversationId = newId();
let busy = false, controller = null, view = 'home';

function newId(){ return 'c-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* Never steal focus on a touch device. Calling input.focus() there throws the
   on-screen keyboard up, which covers half the screen and scrolls the answer
   out of view -- on a phone the keyboard should appear only when the person
   taps the box themselves. Checked live rather than cached, so it stays right
   if a tablet gains or loses a keyboard. */
function canAutofocus(){
  return !matchMedia('(hover: none) and (pointer: coarse)').matches;
}
function focusInput(){ if(canAutofocus()) input.focus(); }

/* The overlay sidebar must be dismissible every way a person will try:
   the button, a tap on the page behind it, or Escape. Previously only the
   button worked, which is a trap on a phone where the sidebar covers most
   of the screen and the button is easy to miss. */
function openSidebar(){
  sidebar.classList.add('open');
  const sc = $('scrim');
  sc.hidden = false;
  // Next frame, so the opacity transition has a starting value to animate
  // from rather than appearing instantly.
  requestAnimationFrame(() => sc.classList.add('on'));
}
function closeSidebar(){
  sidebar.classList.remove('open');
  const sc = $('scrim');
  sc.classList.remove('on');
  // Keep it in the layout until the fade finishes, then take it out so it
  // can never sit invisibly over the page and swallow taps.
  setTimeout(() => { if(!sidebar.classList.contains('open')) sc.hidden = true; }, 200);
}
function toggleSidebar(){
  if(sidebar.classList.contains('open')) closeSidebar(); else openSidebar();
}
function el(t,c,x){ const n=document.createElement(t); if(c)n.className=c; if(x!==undefined)n.textContent=x; return n; }
function atBottom(){ return scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 130; }

/* ----------------------------------------------------------- scrolling --
   Pinning the newest turn to the BOTTOM edge leaves a question and its
   answer crushed against the composer with nowhere to grow. Instead the
   question is glided to the CENTRE of the viewport and `tailpad` reserves
   the room below it, so the answer streams downward into empty space that is
   already there. The page stops moving under the reader's eyes.

   `tailpad` shrinks as the answer grows. Once it reaches zero the maths
   below degenerates to ordinary follow-the-bottom, with no special case. */
const PARK_MIN = 10;      // never closer to the top edge than this
let stick = false;        // follow new content?
let parkTop = -1;         // content-space Y of the parked question, -1 = none
let parkNode = null;      // the question element being parked
let parkGap = PARK_MIN;   // screen-space distance from the top to that question
let lastSelfScroll = 0;   // when WE last moved the scroller
let glideUntil = 0;       // a smooth scroll is in flight until this moment
const GLIDE_MS = 420;

/* Honoured, not assumed: a reader who has asked the system for less motion
   gets the instant jump instead of the glide. */
const CALM = (() => {
  try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch{ return false; }
})();

/* Centre the question BLOCK, not its top edge: a two-line question centred
   by its top would hang below the middle. Falls back to PARK_MIN when the
   question is so tall that centring it would push it off the top. */
function measureGap(){
  if(!parkNode) return PARK_MIN;
  const gap = (scroll.clientHeight - parkNode.getBoundingClientRect().height) / 2;
  return gap > PARK_MIN ? gap : PARK_MIN;
}

function setScrollTop(v, smooth){
  lastSelfScroll = performance.now();
  if(smooth && !CALM && typeof scroll.scrollTo === 'function'){
    glideUntil = lastSelfScroll + GLIDE_MS;
    scroll.scrollTo({top: v, behavior: 'smooth'});
  }else{
    scroll.scrollTop = v;
  }
}

/* Y of a node inside the scrolled content. Measured rather than read from
   offsetTop, which is relative to the nearest positioned ancestor and would
   silently change meaning if any wrapper ever gains `position`. */
function contentTop(node){
  return node.getBoundingClientRect().top
       - scroll.getBoundingClientRect().top + scroll.scrollTop;
}

function sizePad(){
  if(!tailpad) return;
  if(parkTop < 0){ tailpad.style.height = '0px'; return; }
  tailpad.style.height = '0px';                     // measure without it
  const below = scroll.scrollHeight - parkTop;      // content under the question
  const need = scroll.clientHeight - parkGap - below;
  tailpad.style.height = (need > 0 ? need : 0) + 'px';
}

function follow(smooth){
  if(!stick) return;
  sizePad();
  /* The first tokens often land while the view is still gliding. Assigning
     scrollTop here would snap it to the end mid-flight, so the pad is kept
     accurate but the scroller is left alone until the glide finishes. The
     target does not drift meanwhile: the pad shrinks by exactly what the
     answer grows, so `scrollHeight - clientHeight` stays put. */
  if(!smooth && performance.now() < glideUntil) return;
  /* While the pad has height this lands exactly on `parkTop - parkGap`, so
     the question holds still at the centre; after the pad is used up it is
     simply the bottom of the thread. One expression covers both. */
  setScrollTop(scroll.scrollHeight - scroll.clientHeight, smooth);
}

function park(node){
  parkNode = node;
  parkTop = contentTop(node);
  parkGap = measureGap();
  stick = true;
  follow(true);
}

function releasePad(){
  parkTop = -1; parkNode = null; parkGap = PARK_MIN; stick = false;
  if(tailpad) tailpad.style.height = '0px';
}

function down(force){
  if(force){ stick = true; setScrollTop(scroll.scrollHeight); return; }
  if(parkTop >= 0){ follow(); return; }
  if(atBottom()) setScrollTop(scroll.scrollHeight);
}

const STARTERS = [
  'How many days of annual leave do I get?',
  'What does error ND-1042 mean?',
  'What is the hotel limit outside Dhaka?',
  'What time does the return office bus leave?',
  'অফিস বাস মিরপুর থেকে কখন ছাড়ে?',
];

const ICON_SEND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const ICON_STEPS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>';
const ICON_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
const ICON_BULB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.5.4.8 1 .9 1.6l.1.6h5.2l.1-.6c.1-.6.4-1.2.9-1.6A6 6 0 0 0 12 3z"/></svg>';
const ICON_CHEV_S = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const ICON_CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

scroll.addEventListener('scroll', () => {
  topbar.classList.toggle('scrolled', scroll.scrollTop > 4);
  /* Scroll events do not say who caused them, so our own moves are
     recognised by having just happened. Anything else is the reader, and
     the reader decides: scrolled away, we stop chasing; scrolled back to
     the bottom, we resume. */
  const t = performance.now();
  if(t - lastSelfScroll > 150 && t > glideUntil) stick = atBottom();
});

/* ------------------------------------------------------------- views -- */
/* The composer is MOVED in the DOM rather than duplicated: two inputs would
   mean two sources of truth for the draft text and the busy state. */
function setView(next){
  view = next;
  const home = next === 'home';
  main.classList.toggle('home', home);
  homeblock.hidden = !home;
  thread.hidden = next !== 'chat';
  arch.hidden = next !== 'arch';
  if(next !== 'chat') releasePad();
  composerWrap.hidden = next === 'arch';
  if(typeof openPicker === 'function') openPicker(false);
  legal.hidden = home;
  $('navarch').classList.toggle('on', next === 'arch');
  syncSidebarActive();
  threadTitle.textContent = next === 'arch' ? 'Architecture'
                          : next === 'chat' ? threadTitle.dataset.title || '' : '';
  if(home) composerSlot.appendChild(composerWrap);
  else if(next === 'chat') main.appendChild(composerWrap);
  if(next !== 'arch') focusInput();
  releasePad();
  scroll.scrollTop = 0;
}

function setTitle(t){ threadTitle.dataset.title = t; if(view==='chat') threadTitle.textContent = t; }

/* Filenames are an implementation detail. The model cites with
   [employee_handbook_v3.md]; the marker is removed from what the reader sees
   and the same documents are named underneath. A half-streamed
   "[employee_hand" is hidden too, so nothing flickers. */
function stripCitations(text){
  let t = text.replace(/\s*\[[^\[\]\n]*?\.(?:md|pdf)\]/gi, '');
  t = t.replace(/\s*\[[^\[\]\n]*$/, '');
  t = t.replace(/[ \t]+\n/g, '\n');
  t = t.replace(/\n*[ \t]*(sources?|citations?|references?)\s*:?\s*$/i, '');
  return t.replace(/\s+$/, '');
}

/* Wall-clock time for a message. The date is only spelled out once it is
   no longer obvious, so today's conversation stays uncluttered. */
function fmtClock(ms){
  // An explicit but unusable timestamp yields NO stamp. Falling back to the
  // current time would label a message from last week as if it had just been
  // sent, which is worse than showing nothing.
  if(ms !== undefined && ms !== null && !(ms > 0)) return '';
  const d = ms ? new Date(ms) : new Date();
  if(isNaN(d.getTime())) return '';
  const t = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const now = new Date();
  if(d.toDateString() === now.toDateString()) return t;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if(d.toDateString() === y.toDateString()) return 'Yesterday ' + t;
  return d.toLocaleDateString([], {day:'numeric', month:'short'}) + ', ' + t;
}

function addTurn(isUser, ms, fresh){
  if(view !== 'chat') setView('chat');
  const turn = el('div','turn ' + (isUser ? 'user' : 'bot') +
                       (fresh ? ' fresh' : ''));
  const bubble = el('div','bubble');
  bubble.appendChild(el('span','sr', isUser ? 'You said: ' : 'Assistant said: '));
  const text = el('div','text');
  bubble.appendChild(text);
  /* Every message carries its own clock. A bot turn is stamped when the
     answer completes, not when it started, so the value is left empty here
     and filled in on the `done` frame. */
  const stamp = el('div','stamp', ms === null ? '' : fmtClock(ms));
  bubble.appendChild(stamp);
  turn.appendChild(bubble);
  log.appendChild(turn);
  down(true);
  return {turn, bubble, text, stamp};
}

/* Sources sit directly under the answer, ABOVE the process bar: they are
   part of the answer -- the reader's means of checking it -- while the step
   list is an explanation of how it was produced. `before` is the node to
   insert ahead of, so replaying a stored conversation (which has no process
   bar) can simply append. */
function renderSources(bubble, citations, before){
  if(!citations || !citations.length) return;
  const box = el('div','sources');

  const head = el('div','sources-head');
  head.innerHTML = ICON_DOC;
  head.appendChild(el('span', null, citations.length === 1 ? 'Source' : 'Sources'));
  head.appendChild(el('span','count', String(citations.length)));
  box.appendChild(head);

  const list = el('div','srcs');
  citations.forEach(c => {
    const sup = c.status === 'superseded';
    const chip = el('span','src' + (sup ? ' sup' : ''));
    chip.innerHTML = ICON_DOC;
    chip.appendChild(el('span','nm', c.title));
    /* A superseded document is still shown -- the correct answer cites both
       and says which figure is current -- but it must never look equal to
       the one in force. */
    if(sup) chip.appendChild(el('span','tag','superseded'));
    list.appendChild(chip);
  });
  box.appendChild(list);

  if(before && before.parentNode === bubble) bubble.insertBefore(box, before);
  else bubble.appendChild(box);
}

/* ------------------------------------------------- process inspector --- */
/* Every answer carries its own step list: what finished, what is running,
   what has not started. Collapsed by default so it never competes with the
   answer; kept after completion so a slow reply can be explained rather
   than guessed at. */
/* Filled in by /health below. Declared up here because the step list names
   the models, and those names come from the server's live config rather than
   from a constant that a .env override could silently contradict. */
/* What this assistant can be asked, grouped by the KIND of question rather
   than by document. Every entry is drawn from eval/eval_questions.csv -- the
   40 questions whose behaviour is actually measured -- so the picker can only
   ever offer something the project has evidence about. Two deliberate
   omissions are noted where they occur. */
const EXAMPLES = [
  {g:'Policies and HR',
   why:'Hours, leave, probation and notice, from the employee handbook.',
   qs:['What are the standard office hours?',

let health = null;

const STEPS = [
  {key:'rewriting', name:'Understand the question', subs:[
    {key:'history', name:'Check the earlier turns', tools:['memory.py']},
    {key:'query',   name:'Settle the search query', tools:[{m:'rewrite'},'Ollama']},
  ]},
  {key:'searching', name:'Search the documents', subs:[
    {key:'bm25',   name:'Keyword search',            tools:['rank_bm25']},
    {key:'vector', name:'Meaning search',            tools:[{m:'embed'},'Qdrant']},
    {key:'fuse',   name:'Merge the two rankings',    tools:['rrf.py']},
    {key:'boost',  name:'Protect exact identifiers', tools:['code_boost.py']},
    {key:'rerank', name:'Re-read each candidate',    tools:[{m:'reranker'},'ONNX Runtime']},
  ]},
  {key:'reading', name:'Choose the passages', subs:[
    {key:'floor', name:'Check relevance',    tools:['engine.py']},
    {key:'pick',  name:'Pick what to quote', tools:['prompts.py']},
  ]},
  {key:'writing', name:'Write the answer', subs:[
    {key:'prefill', name:'Read the passages',         tools:[{m:'llm'},'Ollama']},
    {key:'gen',     name:'Generate, token by token',  tools:[{m:'llm'},'Ollama']},
  ]},
];

/* A tool chip is either a literal (our own module, or a library whose name
   cannot change) or {m:'<key>'}, meaning "whatever /health says is configured
   for that role". The indirection matters: LLM_MODEL, EMBED_MODEL,
   REWRITE_MODEL and RERANKER_MODEL are all .env-overridable, and a chip that
   names a model the server is not actually running would be worse than no
   chip at all. */
const toolChips = [];
function toolName(spec){
  if(typeof spec === 'string') return spec;
  const m = health && health.models && health.models[spec.m];
  if(!m) return 'local model';
  // "jinaai/jina-reranker-v2-base-multilingual" -> drop the publisher prefix.
  return m.indexOf('/') >= 0 ? m.slice(m.lastIndexOf('/') + 1) : m;
}
function renderTools(sbody, specs){
  (specs || []).forEach(spec => {
    const chip = el('span','tool', toolName(spec));
    if(typeof spec !== 'string'){
      chip.title = 'Configured as ' + spec.m.toUpperCase() + '_MODEL';
      /* Health may still be in flight when a stored conversation is replayed,
         so every model chip stays addressable and is corrected on arrival. */
      toolChips.push({chip:chip, spec:spec});
    }
    sbody.appendChild(chip);
  });
}
function refreshTools(){
  toolChips.forEach(t => { t.chip.textContent = toolName(t.spec); });
}
const SUBTOTAL = STEPS.reduce((n,s) => n + s.subs.length, 0);

/* Whether the step list is open is a reading preference, not per-answer
   state: once opened it stays open for every later answer and across
   reloads, so "show me the steps" only has to be asked once. */
let stepsOpen = false;
try{ stepsOpen = localStorage.getItem('nodi-steps') === 'open'; }catch{}

function fmtMs(ms){
  if(ms === undefined || ms === null || isNaN(ms)) return '';
  // BM25 really does finish in a fraction of a millisecond. Rounding that to
  // "0ms" reads as "this step did not run", which is the opposite of true.
  if(ms < 1) return '<1ms';
  return ms < 950 ? Math.round(ms) + 'ms' : (ms/1000).toFixed(1) + 's';
}

function makeProcess(bubble, opts){
  /* `replay: true` rebuilds the record of an answer that finished earlier.
     There is no live clock in that mode -- the only honest durations are the
     ones that were stored, so nothing is computed from performance.now(). */
  const replay = !!(opts && opts.replay);

  const wrap = el('div','proc');
  const bar = el('div','proc-bar');
  const ring = el('div','ring');
  const label = el('div','proc-label','Starting');
  const clock = el('div','proc-clock','');
  const toggle = el('button','proc-toggle');
  toggle.type = 'button';
  toggle.setAttribute('aria-expanded', String(stepsOpen));
  toggle.innerHTML = ICON_STEPS + '<span>Steps</span>' + ICON_CHEV;
  if(!replay) bar.appendChild(ring);
  bar.appendChild(label); bar.appendChild(clock);
  bar.appendChild(el('span','grow')); bar.appendChild(toggle);
  wrap.appendChild(bar);

  const list = el('ol','steps');
  list.hidden = !stepsOpen;
  const rows = STEPS.map(s => {
    const li = el('li','step pending');
    const mark = el('div','mark');
    const body = el('div','body');

    /* Name and its own collapse control share a row, so each step can be
       opened on its own without expanding the other three. */
    const nrow = el('div','nrow');
    nrow.appendChild(el('span','name', s.name));
    const stog = el('button','substoggle');
    stog.type = 'button';
    stog.title = s.subs.length + ' sub-steps';
    stog.setAttribute('aria-label', 'Show sub-steps of ' + s.name);
    stog.setAttribute('aria-expanded','false');
    stog.innerHTML = ICON_CHEV_S;
    nrow.appendChild(stog);
    body.appendChild(nrow);

    const detail = el('div','detail'); detail.hidden = true;
    body.appendChild(detail);

    const sublist = el('ul','substeps');
    sublist.hidden = true;
    const subs = {};
    s.subs.forEach(sb => {
      const sli = el('li','substep');
      const smark = el('div','smark');
      const sbody = el('div','sbody');
      sbody.appendChild(el('span','snm', sb.name));
      renderTools(sbody, sb.tools);
      const val = el('span','sval','');
      sbody.appendChild(val);
      const sms = el('div','sms','');
      sli.appendChild(smark); sli.appendChild(sbody); sli.appendChild(sms);
      sublist.appendChild(sli);
      subs[sb.key] = {li:sli, mark:smark, val:val, ms:sms, touched:false};
    });
    body.appendChild(sublist);

    const ms = el('div','ms','');
    li.appendChild(mark); li.appendChild(body); li.appendChild(ms);
    list.appendChild(li);

    const row = {li, mark, detail, ms, sublist, subs, started:0, pinned:false};

    function show(open){
      sublist.hidden = !open;
      stog.setAttribute('aria-expanded', String(open));
    }
    stog.addEventListener('click', () => {
      const open = stog.getAttribute('aria-expanded') === 'true';
      /* Once a step has been opened or closed by hand, stop moving it: the
         automatic open-while-running / close-when-done behaviour is a
         convenience, never an override of an explicit choice. */
      row.pinned = true;
      show(!open);
      down();
    });
    row.show = show;
    return row;
  });
  wrap.appendChild(list);
  bubble.appendChild(wrap);

  toggle.addEventListener('click', () => {
    const open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    list.hidden = open;
    stepsOpen = !open;
    try{ localStorage.setItem('nodi-steps', stepsOpen ? 'open' : 'closed'); }catch{}
    down();
  });

  const t0 = performance.now();
  let current = -1;
  const timer = replay ? 0 : setInterval(() => {
    /* Total elapsed, always visible while the answer is being produced. On a
       long wait a moving number is the difference between "working" and
       "hung". */
    clock.textContent = '\u00b7 ' + Math.round((performance.now() - t0)/1000) + 's';
    if(current >= 0 && rows[current].started > 0){
      rows[current].ms.textContent =
        ((performance.now() - rows[current].started)/1000).toFixed(1) + 's';
    }
  }, 150);

  function paintSub(r, state){
    r.li.className = 'substep' + (state ? ' ' + state : '');
    r.mark.textContent = state === 'done' ? '\u2713'
                       : state === 'skip' ? '\u2013' : '';
  }

  function setSub(stepKey, subKey, state, value, ms, onlyIfUntouched){
    const i = STEPS.findIndex(s => s.key === stepKey);
    if(i < 0) return;
    const r = rows[i].subs[subKey];
    if(!r || (onlyIfUntouched && r.touched)) return;
    paintSub(r, state);
    if(value !== undefined && value !== null && value !== ''){
      r.val.textContent = ' \u2014 ' + value;
      r.touched = true;
    }
    const t = fmtMs(ms);
    if(t) r.ms.textContent = t;
  }

  function finish(i){
    const r = rows[i];
    if(!r || !r.started) return;
    /* Freeze the duration on first completion. Without this, finishing a
       later step recomputes every earlier one from its own start to NOW, so
       the first step inherits the elapsed time of the whole answer. */
    if(r.li.classList.contains('done')) return;
    r.li.className = 'step done';
    r.mark.textContent = '\u2713';
    if(r.started > 0){
      r.ms.textContent = ((performance.now() - r.started)/1000).toFixed(1) + 's';
    }
    Object.keys(r.subs).forEach(k => {
      const sb = r.subs[k];
      if(!sb.li.classList.contains('skip')) paintSub(sb, 'done');
    });
    if(!r.pinned) r.show(false);
  }

  return {
    wrap, list, toggle,
    enter(key){
      const i = STEPS.findIndex(s => s.key === key);
      /* `<=`, not `<`: the server announces "writing" before generation
         starts and the first token arrives much later. Re-entering the step
         would restart its clock and throw away the prefill -- which is the
         part worth seeing, since it is most of the wait. */
      if(i < 0 || i <= current) return;
      for(let n = 0; n <= current; n++) finish(n);
      current = i;
      /* -1 marks "started but not timed here", which keeps finish() working
         on a replay while making sure no duration is invented. */
      rows[i].started = replay ? -1 : performance.now();
      rows[i].li.className = 'step live';
      if(!rows[i].pinned && !replay) rows[i].show(true);
      label.textContent = STEPS[i].name;
    },
    startedAt(key){
      const i = STEPS.findIndex(s => s.key === key);
      return i < 0 || rows[i].started < 0 ? 0 : rows[i].started;
    },
    detail(key, text){
      const i = STEPS.findIndex(s => s.key === key);
      if(i < 0) return;
      rows[i].detail.hidden = false;
      rows[i].detail.textContent = text;
    },
    sub(stepKey, subKey, state, value, ms){
      setSub(stepKey, subKey, state, value, ms, false);
    },
    /* Closes out a sub-step the server never reported on -- e.g. the
       rewriter staying silent because the question already stood alone. */
    subIfUntouched(stepKey, subKey, state, value){
      setSub(stepKey, subKey, state, value, undefined, true);
    },
    skipRest(){
      rows.forEach((r,i) => { if(i > current && !r.started) r.li.remove(); });
    },
    complete(totalSeconds){
      clearInterval(timer);
      for(let n = 0; n <= current; n++) finish(n);
      rows.forEach(r => { if(!r.started) r.li.classList.add('pending'); });
      ring.remove();
      wrap.classList.add('proc-done');
      /* The finished bar keeps the step list reachable: it is the record of
         how this answer was produced, not a spinner to be thrown away. */
      const ran = rows.filter(r => r.started).length;
      toggle.innerHTML = ICON_STEPS + '<span>Steps <span class="n">' + ran +
                         '/' + STEPS.length + ' \u00b7 ' + SUBTOTAL +
                         ' sub-steps</span></span>' + ICON_CHEV;
      label.textContent = totalSeconds !== undefined && totalSeconds !== null
        ? 'Answered in ' + Math.round(totalSeconds) + ' seconds' : 'Finished';
    },
    fail(){ clearInterval(timer); ring.remove(); wrap.classList.add('proc-done');
            label.textContent = 'Stopped'; },
    removeIfTrivial(){ clearInterval(timer); wrap.remove(); },
  };
}

/* ------------------------------------------- stage -> step translation --- */
/* Shared by the live stream and by a replay of a stored answer, so an old
   conversation shows exactly what it showed when it was new. */
function applyStage(proc, bubble, payload){
  const s = payload.stage;
  if(s === 'rewriting'){
    proc.enter('rewriting');
    proc.detail('rewriting', 'Resolving anything the question refers back to');
    proc.sub('rewriting','history','live');
  } else if(s === 'rewritten'){
    proc.enter('rewriting');
    proc.sub('rewriting','history','done','carried context forward');
    proc.sub('rewriting','query','done','\u201c' + payload.query + '\u201d');
    proc.detail('rewriting', 'Rewritten as: \u201c' + payload.query + '\u201d');
  } else if(s === 'searching'){
    /* No `rewritten` frame means the rewriter left the question alone -- a
       normal outcome, not a missing step. */
    proc.subIfUntouched('rewriting','history','done','nothing to carry forward');
    proc.subIfUntouched('rewriting','query','done','used exactly as asked');
    proc.enter('searching');
    proc.detail('searching', 'Keyword and meaning search over the indexed passages, then reranking');
    proc.sub('searching','bm25','live');
    proc.sub('searching','vector','live');
  } else if(s === 'searched'){
    proc.enter('searching');
    const ms = payload.ms || {};
    proc.sub('searching','bm25','done',
      payload.lexical + ' passage' + (payload.lexical === 1 ? '' : 's') +
      ' matched on words', ms.bm25);
    proc.sub('searching','vector','done',
      payload.vector + ' passage' + (payload.vector === 1 ? '' : 's') +
      ' matched on meaning', ms.vector);
    proc.sub('searching','fuse','done',
      (payload.fused || 0) + ' unique, narrowed to ' + payload.candidates +
      ' candidates', ms.fuse);
    proc.sub('searching','boost',
      payload.boosted ? 'done' : 'skip',
      payload.boosted
        ? payload.boosted + ' exact code match' +
          (payload.boosted === 1 ? '' : 'es') + ' given a reserved seat'
        : 'no exact code in this question');
    if(payload.ranking === 'rerank'){
      proc.sub('searching','rerank','done',
        payload.candidates + ' candidates re-read against the question',
        ms.rerank);
    }else{
      proc.sub('searching','rerank','skip','unavailable \u2014 kept fusion order');
    }
    proc.detail('searching',
      payload.lexical + ' keyword matches and ' + payload.vector +
      ' meaning matches, fused to ' + payload.candidates + ' candidates, then ' +
      (payload.ranking === 'rerank' ? 'reranked' : 'ordered by fusion score'));
  } else if(s === 'reading'){
    proc.enter('reading');
    proc.sub('reading','floor','done','top passage clears the relevance floor');
    proc.sub('reading','pick','done',
      payload.sources + ' passage' + (payload.sources === 1 ? '' : 's') +
      (payload.titles && payload.titles.length
        ? ' from ' + payload.titles.join(', ') : ''));
    proc.detail('reading', payload.sources + ' passages chosen' +
      (payload.titles && payload.titles.length
        ? ' from: ' + payload.titles.join(', ') : ''));
  } else if(s === 'writing'){
    proc.enter('writing');
    proc.sub('writing','prefill','live');
    proc.detail('writing', 'Reading the passages, then writing' +
      (payload.model ? ' \u00b7 ' + payload.model : ''));
  } else if(s === 'degraded' || s === 'truncated'){
    bubble.appendChild(el('div','note', payload.message));
  } else {
    proc.enter(s);
  }
}

/* The server's own measurements: it can separate reading from writing
   exactly, which the browser cannot. */
function applyTimings(proc, t){
  const bits = [];
  if(t.prompt_tokens) bits.push(t.prompt_tokens + ' tokens read');
  if(t.output_tokens) bits.push(t.output_tokens + ' written');
  if(t.prefill_s) bits.push(t.prefill_s + 's reading, ' +
                            (t.generate_s || 0) + 's writing');
  if(bits.length) proc.detail('writing', bits.join(' \u00b7 '));
  if(t.prefill_s !== undefined){
    proc.sub('writing','prefill','done',
      t.prompt_tokens ? t.prompt_tokens + ' tokens read' : null,
      t.prefill_s * 1000);
  }
  if(t.generate_s !== undefined){
    proc.sub('writing','gen','done',
      t.output_tokens ? t.output_tokens + ' tokens written' : null,
      t.generate_s * 1000);
  }
}

/* Rebuild the step record for an answer that finished in an earlier session.
   Returns null when the stored turn predates step recording, in which case
   the message simply has no inspector -- never a fabricated one. */
function replayProcess(bubble, steps, timings){
  if(!steps || !steps.length) return null;
  const proc = makeProcess(bubble, {replay:true});
  steps.forEach(st => { try{ applyStage(proc, bubble, st); }catch{} });
  const t = timings || {};
  applyTimings(proc, t);
  proc.skipRest();
  proc.complete(t.total_s);
  return proc;
}

/* -------------------------------------------------------- SSE parsing -- */
/* sse_starlette terminates lines with CRLF, so frames are separated by
   "\r\n\r\n". Splitting on "\n\n" alone matches NOTHING and every answer
   looks truncated. Accept all three SSE terminators. */
const FRAME_SPLIT = /\r\n\r\n|\n\n|\r\r/;
const LINE_SPLIT = /\r\n|\n|\r/;

function parseFrame(frame){
  let event='message', data='';
  for(const line of frame.split(LINE_SPLIT)){
    if(!line || line.startsWith(':')) continue;
    if(line.startsWith('event:')) event = line.slice(6).trim();
    else if(line.startsWith('data:')) data += line.slice(5).replace(/^ /,'');
  }
  if(!data) return null;
  try{ return {event, payload: JSON.parse(data)}; }catch{ return null; }
}

/* -------------------------------------------------------------- ask ---- */
async function ask(question){
  question = (question||'').trim();
  if(busy || !question) return;
  busy = true; setSending(true);

  const userTurn = addTurn(true, undefined, true);
  userTurn.text.textContent = question;
  if(!threadTitle.dataset.title){
    setTitle(question.length > 64 ? question.slice(0,63)+'…' : question);
  }

  const {bubble, text, stamp} = addTurn(false, null, true);
  const proc = makeProcess(bubble);
  /* Lift the question to the top and reserve the viewport below it, BEFORE
     the first stage frame arrives -- otherwise the step list appears at the
     bottom edge and the reader watches it crawl upward. */
  park(userTurn.turn);
  const started = performance.now();

  let answer='', gotDone=false, aborted=false, sawStage=false, firstTokenAt=0;
  controller = new AbortController();

  try{
    const res = await fetch('ask',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question, conversation_id: conversationId}),
      signal: controller.signal,
    });
    if(!res.ok || !res.body) throw new Error('server returned HTTP ' + res.status);

    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer='';
    for(;;){
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value,{stream:true});
      const frames = buffer.split(FRAME_SPLIT);
      buffer = frames.pop();

      for(const raw of frames){
        const parsed = parseFrame(raw);
        if(!parsed) continue;
        const {event, payload} = parsed;

        if(event === 'token'){
          proc.enter('writing');
          if(!firstTokenAt){
            /* Prefill ends exactly here: the model has finished reading the
               passages and has begun writing. On this corpus that boundary
               is most of the wait, so it gets its own measured sub-step. */
            firstTokenAt = performance.now();
            const start = proc.startedAt('writing');
            proc.sub('writing','prefill','done', null,
                     start ? firstTokenAt - start : undefined);
            proc.sub('writing','gen','live');
          }
          answer += payload.text;
          text.textContent = stripCitations(answer);
          text.appendChild(el('span','caret'));
          down();
        } else if(event === 'stage'){
          sawStage = true;
          applyStage(proc, bubble, payload);
        } else if(event === 'error'){
          gotDone = true; proc.fail();
          text.className = 'text err';
          text.textContent = payload.message || payload.code;
        } else if(event === 'done'){
          gotDone = true;
          text.textContent = stripCitations(answer);
          renderSources(bubble, payload.citations, proc.wrap);
          const t = payload.timings || {};
          const total = t.total_s !== undefined ? t.total_s
                      : (performance.now()-started)/1000;
          stamp.textContent = fmtClock();
          // An instant canned reply has no pipeline worth inspecting.
          if(!sawStage && total < 3) proc.removeIfTrivial();
          else {
            applyTimings(proc, t);
            proc.skipRest(); proc.complete(total);
          }
          down();
        }
      }
    }
  }catch(err){
    if(err && err.name === 'AbortError'){
      aborted = true; gotDone = true;
      proc.fail();
      text.textContent = stripCitations(answer);
      bubble.appendChild(el('div','note','Stopped.'));
    }else{
      proc.fail();
      text.className = 'text err';
      text.textContent = 'Could not reach the server: ' + (err && err.message ? err.message : err);
      gotDone = true;
    }
  }

  /* Re-measure once the answer has stopped growing: the pad shrinks to
     exactly the leftover room, so a short answer does not leave a screenful
     of blank space and a long one leaves none. */
  follow();
  const c = text.querySelector('.caret'); if(c) c.remove();
  // Even a stopped or failed turn is a thing that happened at a time.
  if(!stamp.textContent) stamp.textContent = fmtClock();

  /* A stream that ends without a `done` frame is FAILED, never a complete
     answer: a truncated reply that reads as confident is the worst possible
     failure mode for a citation-backed assistant. */
  if(!gotDone && !aborted){
    proc.fail();
    text.textContent = stripCitations(answer);
    bubble.appendChild(el('div','note',
      'The connection ended before the answer finished, so this reply may be incomplete.'));
  }

  controller = null; busy = false; setSending(false);
  refreshConversations();
  focusInput();
}

function setSending(on){
  sendBtn.innerHTML = on ? ICON_STOP : ICON_SEND;
  sendBtn.title = on ? 'Stop' : 'Send';
  sendBtn.disabled = !on && !input.value.trim();
}

/* ------------------------------------------------------- conversations -- */
function dayLabel(ts){
  const d = new Date(ts*1000), now = new Date();
  if(d.toDateString() === now.toDateString()) return 'Today';
  const y = new Date(now); y.setDate(now.getDate()-1);
  if(d.toDateString() === y.toDateString()) return 'Yesterday';
  if((now - d)/86400000 < 7) return 'Previous 7 days';
  return 'Earlier';
}

async function refreshConversations(){
  let list = [];
  try{
    const r = await fetch('conversations');
    list = (await r.json()).conversations || [];
  }catch{ return; }

  convosEl.innerHTML = '';
  if(!list.length){
    convosEl.appendChild(el('div','empty-note','No conversations yet.'));
    return;
  }
  let group = '';
  list.forEach(c => {
    const g = dayLabel(c.updated_at);
    if(g !== group){ group = g; convosEl.appendChild(el('div','grouplabel', g)); }

    const row = el('button','convo');
    row.type = 'button';
    row.dataset.id = c.conversation_id;
    row.appendChild(el('span', null, c.title));

    const del = el('button','del');
    del.type = 'button'; del.title = 'Delete';
    del.innerHTML = ICON_TRASH;
    del.addEventListener('click', async ev => {
      ev.stopPropagation();
      try{ await fetch('conversations/' + encodeURIComponent(c.conversation_id), {method:'DELETE'}); }catch{}
      if(c.conversation_id === conversationId) startNew();
      refreshConversations();
    });
    row.appendChild(del);
    row.addEventListener('click', () => openConversation(c.conversation_id, c.title));
    convosEl.appendChild(row);
  });
  syncSidebarActive();
}

/* Exactly one thing in the sidebar is selected at a time. Leaving a
   conversation for the Architecture page used to leave the conversation
   highlighted as well, so two rows looked current at once. The highlight is
   derived from the view here rather than painted once at render time. */
function syncSidebarActive(){
  const inChat = view === 'chat';
  convosEl.querySelectorAll('.convo').forEach(r => {
    r.classList.toggle('active', inChat && r.dataset.id === conversationId);
  });
}

async function openConversation(id, title){
  if(busy && controller) controller.abort();
  let data;
  try{
    const r = await fetch('conversations/' + encodeURIComponent(id));
    if(!r.ok) return;
    data = await r.json();
  }catch{ return; }

  conversationId = id;
  log.innerHTML = '';
  /* The reserved room belongs to one question in one conversation. Opening
     another must not inherit it, or the new thread opens with a gap under
     it that nothing is going to fill. */
  releasePad();
  setView('chat');
  setTitle(title || data.title || 'Conversation');

  (data.turns || []).forEach(t => {
    const isUser = t.role === 'user';
    // `ts` is seconds since the epoch on the server; Date wants milliseconds.
    const {bubble, text} = addTurn(isUser, t.ts ? t.ts * 1000 : null);
    text.textContent = isUser ? t.content : stripCitations(t.content);
    if(!isUser){
      /* Rebuild the step record from what was stored with the answer, so a
         reopened conversation explains itself exactly as it did when live.
         Turns saved before step recording simply have no inspector. */
      const proc = replayProcess(bubble, t.steps, t.timings);
      renderSources(bubble, t.citations, proc ? proc.wrap : null);
    }
  });

  closeSidebar();
  refreshConversations();
  down(true);
}

function startNew(){
  if(busy && controller) controller.abort();
  conversationId = newId();
  log.innerHTML = '';
  threadTitle.dataset.title = '';
  setView('home');
  closeSidebar();
  refreshConversations();
}

/* ------------------------------------------------------------- wiring -- */
form.addEventListener('submit', e => {
  e.preventDefault();
  if(busy){ if(controller) controller.abort(); return; }
  const q = input.value;
  input.value = ''; input.style.height = 'auto';
  ask(q);
});
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 192) + 'px';
  if(!busy) sendBtn.disabled = !input.value.trim();
});

/* ------------------------------------------------- the example picker -- */
const exBtn = $('exbtn'), exPop = $('expop');
exBtn.innerHTML = ICON_BULB;

(function buildExamples(){
  const head = el('div','exhead',
    'Pick one to put it in the box — you can edit it before sending.');
  exPop.appendChild(head);
  EXAMPLES.forEach(group => {
    const g = el('div','exgroup');
    g.appendChild(el('div','gname', group.g));
    g.appendChild(el('div','gwhy', group.why));
    exPop.appendChild(g);
    group.qs.forEach(q => {
      const b = el('button','exq', q);
      b.type = 'button';
      b.addEventListener('click', () => {
        /* Fill, never send. During a live demo an accidental click should
           cost a keystroke, not a 20-second answer to the wrong question. */
        input.value = q;
        openPicker(false);
        focusInput();
        input.setSelectionRange(q.length, q.length);
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 192) + 'px';
        if(!busy) sendBtn.disabled = !input.value.trim();
      });
      exPop.appendChild(b);
    });
  });
})();

function openPicker(open){
  exPop.hidden = !open;
  exBtn.setAttribute('aria-expanded', String(open));
  if(open) exPop.scrollTop = 0;
}
exBtn.addEventListener('click', e => {
  e.stopPropagation();
  openPicker(exBtn.getAttribute('aria-expanded') !== 'true');
});
/* Clicking anywhere else, or pressing Escape, closes it. The composer is
   excluded so typing with the panel open does not dismiss it mid-thought. */
document.addEventListener('click', e => {
  if(exPop.hidden) return;
  if(!exPop.contains(e.target) && e.target !== exBtn) openPicker(false);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !exPop.hidden){ openPicker(false); exBtn.focus(); }
});

window.addEventListener('resize', () => {
  /* Both the centre and the question's own position depend on the viewport
     and on how the text re-wraps, so each is re-measured, not remembered. */
  if(parkTop < 0 || !parkNode) return;
  parkTop = contentTop(parkNode);
  parkGap = measureGap();
  follow();
});

$('newchat').addEventListener('click', () => { startNew(); focusInput(); });
$('navarch').addEventListener('click', () => {
  setView('arch');
  closeSidebar();
});
function setSidebar(hidden){
  document.querySelector('.app').classList.toggle('nosidebar', hidden);
  closeSidebar();
  try{ localStorage.setItem('nodi-sidebar', hidden ? 'hidden' : 'shown'); }catch{}
}
$('sidetoggle').addEventListener('click', () => setSidebar(true));
$('scrim').addEventListener('click', closeSidebar);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
});
$('burger').addEventListener('click', () => {
  // Narrow screens slide the sidebar over the page; wide screens restore it.
  if(document.querySelector('.app').classList.contains('nosidebar')) setSidebar(false);
  else toggleSidebar();
});
try{
  if(localStorage.getItem('nodi-sidebar') === 'hidden') setSidebar(true);
}catch{}
$('theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('nodi-theme', next); }catch{}
});
try{
  const saved = localStorage.getItem('nodi-theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
}catch{}

const startersEl = $('starters');
STARTERS.forEach(t => {
  const b = el('button','starter', t); b.type='button';
  b.addEventListener('click', () => ask(t));
  startersEl.appendChild(b);
});

fetch('health').then(r => r.json()).then(h => {
  health = h;
  refreshTools();
  $('footstat').textContent = h.ok ? h.index.chunks + ' passages indexed' : 'degraded';
  if(!h.ok) $('dot').classList.add('bad');
  $('infotip').textContent =
    'The company documents are split into ' + h.index.chunks + ' searchable ' +
    'passages — a section or a whole table each. Every question is answered ' +
    'only from these, never from the model’s own knowledge. Running ' +
    (h.models ? h.models.llm : 'a local model') + ' on this machine.';
}).catch(() => {
  $('dot').classList.add('bad');
  $('footstat').textContent = 'server unreachable';
  $('infotip').textContent = 'The assistant cannot reach its backend. ' +
    'Check that the server and Ollama are both running.';
});

setView('home');
setSending(false);
refreshConversations();
