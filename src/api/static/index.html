<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodi Tech Assistant</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1a1d21; --muted: #6b7280;
    --line: #e3e6ea; --accent: #1f6feb; --accent-ink: #ffffff;
    --warn-bg: #fff7e6; --warn-line: #e0b35c; --warn-ink: #7a5300;
    --err-bg: #fdeced; --err-line: #e0697a; --err-ink: #8a1c2b;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a; --panel: #1d2024; --ink: #e8eaed; --muted: #9aa3ad;
      --line: #2c3137; --accent: #4493f8; --accent-ink: #0b1117;
      --warn-bg: #2e2515; --warn-line: #7a5f28; --warn-ink: #e8c87a;
      --err-bg: #2d1619; --err-line: #7d3540; --err-ink: #f0a5ae;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel); position: sticky; top: 0; z-index: 5;
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  header .spacer { flex: 1; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  .msg { margin: 0 0 14px; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .bubble {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 11px 13px; white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .me .bubble { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .bubble.err { background: var(--err-bg); border-color: var(--err-line); color: var(--err-ink); }
  .bubble.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
  .stage { font-size: 12.5px; color: var(--muted); margin: 4px 0 10px; min-height: 18px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         background: var(--accent); margin-right: 7px; animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  .cites { margin-top: 9px; display: flex; gap: 6px; flex-wrap: wrap; }
  .cite {
    font-size: 11.5px; border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 9px; color: var(--muted); background: var(--bg);
  }
  .cite.sup { border-color: var(--warn-line); color: var(--warn-ink); }
  .timings { font-size: 11.5px; color: var(--muted); margin-top: 7px; }
  form {
    position: sticky; bottom: 0; background: var(--panel);
    border-top: 1px solid var(--line); padding: 11px 16px;
    display: flex; gap: 9px; max-width: 820px; margin: 0 auto;
  }
  textarea {
    flex: 1; resize: none; font: inherit; color: inherit; padding: 9px 11px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
    min-height: 42px; max-height: 150px;
  }
  button {
    font: inherit; font-weight: 600; padding: 0 17px; border: 0;
    border-radius: 9px; background: var(--accent); color: var(--accent-ink);
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .examples { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .examples button {
    background: var(--panel); color: var(--muted); border: 1px solid var(--line);
    font-size: 12.5px; font-weight: 500; padding: 5px 10px; border-radius: 999px;
  }
  @media (max-width: 520px) { main, form { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <h1>Nodi Tech Assistant</h1>
  <span class="sub" id="status">checking…</span>
  <span class="spacer"></span>
  <button class="ghost" id="reset" type="button">New conversation</button>
</header>

<main>
  <div class="examples" id="examples"></div>
  <div id="log"></div>
  <div class="stage" id="stage"></div>
</main>

<form id="form">
  <textarea id="q" rows="1" placeholder="Ask about leave, pricing, API errors… (Bangla works too)"></textarea>
  <button id="send" type="submit">Ask</button>
</form>

<script>
const log = document.getElementById('log');
const stageEl = document.getElementById('stage');
const form = document.getElementById('form');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');

let conversationId = 'web-' + Math.random().toString(36).slice(2, 10);
let busy = false;

const EXAMPLES = [
  'How many days of annual leave do I get?',
  'What does error ND-1042 mean?',
  'What is the hotel limit outside Dhaka?',
  'অফিস বাস মিরপুর থেকে কখন ছাড়ে?',
];

const STAGE_TEXT = {
  rewriting: 'Understanding the question…',
  rewritten: 'Searching for: ',
  searching: 'Searching documents…',
  reading: 'Reading sources…',
  writing: 'Writing the answer…',
  truncated: '',
  degraded: '',
};

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function addMessage(who, cls) {
  const wrap = el('div', 'msg ' + (cls || ''));
  wrap.appendChild(el('div', 'who', who));
  const bubble = el('div', 'bubble');
  wrap.appendChild(bubble);
  log.appendChild(wrap);
  window.scrollTo(0, document.body.scrollHeight);
  return { wrap, bubble };
}

function setStage(text) {
  stageEl.innerHTML = '';
  if (!text) return;
  stageEl.appendChild(el('span', 'dot'));
  stageEl.appendChild(document.createTextNode(text));
}

function renderCitations(wrap, citations) {
  if (!citations || !citations.length) return;
  const box = el('div', 'cites');
  citations.forEach(c => {
    const label = c.status === 'superseded' ? c.doc_id + ' (superseded)' : c.doc_id;
    box.appendChild(el('span', 'cite' + (c.status === 'superseded' ? ' sup' : ''), label));
  });
  wrap.appendChild(box);
}

async function ask(question) {
  if (busy || !question.trim()) return;
  busy = true;
  sendBtn.disabled = true;
  addMessage('You', 'me').bubble.textContent = question;

  const { wrap, bubble } = addMessage('Assistant');
  let gotDone = false;
  let gotText = false;

  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, conversation_id: conversationId }),
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const frames = buffer.split('\n\n');
      buffer = frames.pop();

      for (const frame of frames) {
        let event = 'message', data = '';
        for (const line of frame.split('\n')) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (!data) continue;
        let payload;
        try { payload = JSON.parse(data); } catch { continue; }

        if (event === 'token') {
          gotText = true;
          setStage('');
          bubble.textContent += payload.text;
          window.scrollTo(0, document.body.scrollHeight);
        } else if (event === 'stage') {
          if (payload.stage === 'rewritten') setStage(STAGE_TEXT.rewritten + payload.query);
          else if (payload.stage === 'reading') setStage('Reading ' + payload.sources + ' sources…');
          else if (payload.stage === 'degraded' || payload.stage === 'truncated') {
            const note = addMessage('Notice');
            note.bubble.className = 'bubble warn';
            note.bubble.textContent = payload.message;
          } else setStage(STAGE_TEXT[payload.stage] || '');
        } else if (event === 'error') {
          gotDone = true;   // an explicit error IS a complete outcome
          bubble.className = 'bubble err';
          bubble.textContent = payload.message || payload.code;
        } else if (event === 'done') {
          gotDone = true;
          renderCitations(wrap, payload.citations);
          if (payload.timings && payload.timings.total_s !== undefined) {
            wrap.appendChild(el('div', 'timings',
              payload.timings.total_s + 's total · ' +
              (payload.timings.output_tokens || 0) + ' tokens · ' +
              'retrieval ' + (payload.timings.retrieve_s || 0) + 's'));
          }
        }
      }
    }
  } catch (err) {
    bubble.className = 'bubble err';
    bubble.textContent = 'Could not reach the server: ' + err.message;
    gotDone = true;
  }

  // Plan M4.5 / R12: a stream that ends without a `done` frame is FAILED,
  // never a complete answer. A truncated reply that looks confident is the
  // worst possible failure mode for a citation bot.
  if (!gotDone) {
    bubble.className = 'bubble err';
    bubble.textContent = (gotText ? bubble.textContent + '\n\n' : '') +
      '[The answer was cut off before it finished. Please ask again.]';
  }

  setStage('');
  busy = false;
  sendBtn.disabled = false;
  input.focus();
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const q = input.value;
  input.value = '';
  input.style.height = 'auto';
  ask(q);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
});

document.getElementById('reset').addEventListener('click', async () => {
  await fetch('/reset', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question: '', conversation_id: conversationId }),
  });
  conversationId = 'web-' + Math.random().toString(36).slice(2, 10);
  log.innerHTML = '';
  setStage('');
});

const examples = document.getElementById('examples');
EXAMPLES.forEach(text => {
  const b = el('button', null, text);
  b.type = 'button';
  b.addEventListener('click', () => ask(text));
  examples.appendChild(b);
});

fetch('/health').then(r => r.json()).then(h => {
  statusEl.textContent = h.ok
    ? h.index.chunks + ' chunks · ' + h.models.llm + ' · local only'
    : 'degraded — check Ollama';
}).catch(() => { statusEl.textContent = 'server unreachable'; });

input.focus();
</script>
</body>
</html>
