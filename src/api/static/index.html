<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodi Tech Assistant</title>
<style>
  /* No external fonts or CDNs anywhere in this file: the whole point of the
     project is that it works with the network unplugged. */
  :root {
    --bg:#f7f8fa; --panel:#ffffff; --panel-2:#fbfcfd;
    --ink:#11161d; --ink-2:#434d5a; --muted:#78808d;
    --line:#e4e8ed; --line-2:#eef1f5;
    --accent:#2f6df6; --accent-ink:#ffffff; --accent-soft:#eaf1fe;
    --warn-bg:#fff8e8; --warn-line:#e8c27a; --warn-ink:#7a5a12;
    --err-bg:#fdecee; --err-line:#e59aa4; --err-ink:#8d1f2d;
    --ok:#1a8f5f;
    --r:14px; --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1216; --panel:#171b21; --panel-2:#1b2027;
      --ink:#e9edf2; --ink-2:#b4bdc8; --muted:#8a94a1;
      --line:#262c35; --line-2:#20262e;
      --accent:#4d8bff; --accent-ink:#07101f; --accent-soft:#17263f;
      --warn-bg:#2a2314; --warn-line:#6d5726; --warn-ink:#e8c87a;
      --err-bg:#2b1519; --err-line:#7a3540; --err-ink:#f3a8b2;
      --ok:#3fbf8a;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0f1216; --panel:#171b21; --panel-2:#1b2027;
    --ink:#e9edf2; --ink-2:#b4bdc8; --muted:#8a94a1;
    --line:#262c35; --line-2:#20262e;
    --accent:#4d8bff; --accent-ink:#07101f; --accent-soft:#17263f;
    --warn-bg:#2a2314; --warn-line:#6d5726; --warn-ink:#e8c87a;
    --err-bg:#2b1519; --err-line:#7a3540; --err-ink:#f3a8b2;
    --ok:#3fbf8a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
         "Helvetica Neue", Arial, "Noto Sans Bengali", sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }

  /* ----------------------------------------------------------- header -- */
  header {
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .head-in {
    max-width:860px; margin:0 auto; padding:11px 20px;
    display:flex; align-items:center; gap:12px;
  }
  .mark {
    width:30px; height:30px; border-radius:9px; flex:none;
    background:linear-gradient(145deg, var(--accent), #7aa6ff);
    display:grid; place-items:center; color:#fff; font-weight:700; font-size:13px;
    letter-spacing:-.4px; box-shadow:var(--shadow);
  }
  .titles { display:flex; flex-direction:column; line-height:1.25; min-width:0; }
  .titles b { font-size:14.5px; font-weight:650; letter-spacing:-.1px; }
  .titles span {
    font-size:11.5px; color:var(--muted); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .spacer { flex:1; }
  .pill {
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px;
    color:var(--ink-2); background:var(--panel-2); border:1px solid var(--line);
    padding:4px 10px; border-radius:999px; white-space:nowrap;
  }
  .dot-ok { width:6px; height:6px; border-radius:50%; background:var(--ok); flex:none; }
  .dot-bad { background:#d9534f; }
  .iconbtn {
    width:32px; height:32px; display:grid; place-items:center; flex:none;
    border:1px solid var(--line); background:var(--panel); color:var(--ink-2);
    border-radius:9px; cursor:pointer; transition:background .15s, color .15s;
  }
  .iconbtn:hover { background:var(--panel-2); color:var(--ink); }
  .iconbtn svg { width:16px; height:16px; }

  /* ------------------------------------------------------------ main --- */
  main { flex:1; overflow-y:auto; }
  .wrap { max-width:860px; margin:0 auto; padding:26px 20px 8px; }

  /* empty state */
  .hero { padding:38px 0 10px; }
  .hero h1 {
    font-size:26px; line-height:1.25; margin:0 0 8px;
    font-weight:650; letter-spacing:-.5px;
  }
  .hero p { margin:0 0 22px; color:var(--muted); font-size:14.5px; max-width:60ch; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media (max-width:640px){ .grid { grid-template-columns:1fr; } }
  .card {
    text-align:left; border:1px solid var(--line); background:var(--panel);
    border-radius:var(--r); padding:13px 15px; cursor:pointer; font:inherit;
    color:var(--ink); transition:border-color .15s, transform .12s, box-shadow .15s;
  }
  .card:hover { border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow); }
  .card b { display:block; font-size:14px; font-weight:570; margin-bottom:3px; }
  .card span { font-size:12px; color:var(--muted); }

  /* messages */
  .msg { padding:18px 0; border-top:1px solid var(--line-2); }
  .msg:first-child { border-top:0; }
  .role { display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .avatar {
    width:22px; height:22px; border-radius:6px; flex:none; display:grid;
    place-items:center; font-size:10.5px; font-weight:700; color:#fff;
    background:linear-gradient(145deg,var(--accent),#7aa6ff);
  }
  .avatar.user { background:linear-gradient(145deg,#6b7482,#99a3b1); }
  .role b { font-size:12.5px; font-weight:600; color:var(--ink-2); letter-spacing:.1px; }
  .body { font-size:15px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .body.err {
    background:var(--err-bg); border:1px solid var(--err-line); color:var(--err-ink);
    border-radius:10px; padding:11px 13px; white-space:pre-wrap;
  }
  .notice {
    background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--warn-ink);
    border-radius:10px; padding:9px 12px; font-size:13px; margin-top:8px;
  }
  .cite-inline {
    font-size:12.5px; color:var(--accent); background:var(--accent-soft);
    border-radius:5px; padding:1px 5px; white-space:nowrap;
  }
  .caret {
    display:inline-block; width:8px; height:16px; margin-left:1px;
    background:var(--accent); border-radius:1px; vertical-align:-3px;
    animation:blink 1s steps(2,start) infinite;
  }
  @keyframes blink { 50% { opacity:0; } }

  /* citations + meta */
  .cites { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .cite {
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--ink-2);
    border-radius:999px; padding:4px 10px;
  }
  .cite svg { width:11px; height:11px; opacity:.6; flex:none; }
  .cite.sup { border-color:var(--warn-line); color:var(--warn-ink); background:var(--warn-bg); }
  .meta { margin-top:9px; font-size:11.5px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; }

  /* ------------------------------------------------- thinking panel ---- */
  .think {
    border:1px solid var(--line); background:var(--panel); border-radius:var(--r);
    padding:13px 15px; box-shadow:var(--shadow);
  }
  .think-top { display:flex; align-items:center; gap:10px; }
  .spinner {
    width:17px; height:17px; flex:none; border-radius:50%;
    border:2px solid color-mix(in srgb, var(--accent) 22%, transparent);
    border-top-color:var(--accent); animation:spin .7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .think-label { font-size:13.5px; font-weight:550; color:var(--ink); }
  .think-time { margin-left:auto; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .rail { display:flex; gap:5px; margin-top:12px; }
  .seg { height:3px; flex:1; border-radius:2px; background:var(--line); overflow:hidden; }
  .seg.done { background:var(--accent); }
  .seg.active::after {
    content:""; display:block; height:100%; width:40%;
    background:var(--accent); border-radius:2px; animation:slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { 0%{transform:translateX(-100%)} 100%{transform:translateX(320%)} }
  .think-sub { margin-top:9px; font-size:11.5px; color:var(--muted); }

  /* --------------------------------------------------------- composer -- */
  .composer-wrap {
    position:sticky; bottom:0;
    background:linear-gradient(to top, var(--bg) 62%, transparent);
    padding:12px 20px 16px;
  }
  .composer {
    max-width:860px; margin:0 auto; background:var(--panel);
    border:1px solid var(--line); border-radius:var(--r);
    box-shadow:var(--shadow); padding:9px 9px 9px 15px;
    display:flex; align-items:flex-end; gap:9px;
    transition:border-color .15s;
  }
  .composer:focus-within { border-color:var(--accent); }
  textarea {
    flex:1; border:0; outline:0; resize:none; background:transparent;
    color:inherit; font:inherit; line-height:1.55; padding:6px 0;
    max-height:168px; min-height:26px;
  }
  textarea::placeholder { color:var(--muted); }
  .send {
    width:34px; height:34px; flex:none; border:0; border-radius:9px; cursor:pointer;
    background:var(--accent); color:var(--accent-ink); display:grid; place-items:center;
    transition:opacity .15s, transform .12s;
  }
  .send:hover:not(:disabled) { transform:translateY(-1px); }
  .send:disabled { opacity:.35; cursor:not-allowed; }
  .send.stop { background:var(--err-ink); color:#fff; }
  .send svg { width:16px; height:16px; }
  .hint {
    max-width:860px; margin:7px auto 0; font-size:11px; color:var(--muted);
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
  }
  kbd {
    font:inherit; font-size:10.5px; border:1px solid var(--line);
    border-bottom-width:2px; border-radius:4px; padding:0 4px; color:var(--ink-2);
  }
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div class="mark">N</div>
    <div class="titles">
      <b>Nodi Tech Assistant</b>
      <span id="sub">connecting…</span>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="pill"><i class="dot-ok" id="statusdot"></i><span id="pilltext">checking</span></span>
    <button class="iconbtn" id="theme" title="Toggle theme" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
    </button>
    <button class="iconbtn" id="reset" title="New conversation" aria-label="New conversation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
  </div>
</header>

<main id="main">
  <div class="wrap" id="wrap">
    <div id="hero" class="hero">
      <h1>What would you like to know?</h1>
      <p>I answer only from Nodi Tech's internal documents, and I cite every one I use. Everything runs on this machine — no cloud, no API keys.</p>
      <div class="grid" id="cards"></div>
    </div>
    <div id="log"></div>
  </div>
</main>

<div class="composer-wrap">
  <form class="composer" id="form">
    <textarea id="q" rows="1" placeholder="Ask about leave, pricing, API errors…  (বাংলাতেও জিজ্ঞাসা করতে পারেন)"></textarea>
    <button class="send" id="send" type="submit" title="Send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </button>
  </form>
  <div class="hint">
    <span><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> newline</span>
    <span id="speedhint">first answer takes ~50–80 s on this CPU</span>
  </div>
</div>

<script>
'use strict';

const log = document.getElementById('log');
const hero = document.getElementById('hero');
const form = document.getElementById('form');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');
const main = document.getElementById('main');

let conversationId = newId();
let busy = false;
let controller = null;

function newId() { return 'web-' + Math.random().toString(36).slice(2, 10); }

const EXAMPLES = [
  ['How many days of annual leave do I get?', 'Superseded policy — must say 18, not 15'],
  ['What does error ND-1042 mean?', 'Exact identifier lookup'],
  ['What is the hotel limit outside Dhaka?', 'Table inside a PDF'],
  ['What time does the return office bus leave?', 'English question, Bangla-only source'],
  ['অফিস বাস মিরপুর থেকে কখন ছাড়ে?', 'Answers in Bangla'],
  ['Does NodiDesk integrate with WhatsApp?', 'Must say "not mentioned", never "no"'],
];

const STAGES = [
  { key:'rewriting', label:'Understanding the question' },
  { key:'searching', label:'Searching the documents' },
  { key:'reading',   label:'Reading sources' },
  { key:'writing',   label:'Writing the answer' },
];

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function atBottom() {
  return main.scrollHeight - main.scrollTop - main.clientHeight < 120;
}
function scrollDown(force) {
  if (force || atBottom()) main.scrollTop = main.scrollHeight;
}

function addMessage(who, isUser) {
  hero.style.display = 'none';
  const wrap = el('div', 'msg');
  const role = el('div', 'role');
  const av = el('div', 'avatar' + (isUser ? ' user' : ''), isUser ? 'You' : 'N');
  av.textContent = isUser ? 'Y' : 'N';
  role.appendChild(av);
  role.appendChild(el('b', null, who));
  wrap.appendChild(role);
  const body = el('div', 'body');
  wrap.appendChild(body);
  log.appendChild(wrap);
  scrollDown(true);
  return { wrap, body };
}

/* --------------------------------------------------- thinking panel ---- */
function makeThinking(wrap) {
  const panel = el('div', 'think');
  const top = el('div', 'think-top');
  top.appendChild(el('div', 'spinner'));
  const label = el('div', 'think-label', 'Starting…');
  const time = el('div', 'think-time', '0.0s');
  top.appendChild(label); top.appendChild(time);
  panel.appendChild(top);

  const rail = el('div', 'rail');
  const segs = STAGES.map(() => { const s = el('div', 'seg'); rail.appendChild(s); return s; });
  panel.appendChild(rail);

  const sub = el('div', 'think-sub', 'Running entirely on this machine.');
  panel.appendChild(sub);
  wrap.appendChild(panel);

  const t0 = performance.now();
  const timer = setInterval(() => {
    time.textContent = ((performance.now() - t0) / 1000).toFixed(1) + 's';
  }, 100);

  return {
    panel, timer,
    setStage(key, text, subtext) {
      const i = STAGES.findIndex(s => s.key === key);
      if (i >= 0) {
        segs.forEach((s, n) => {
          s.className = 'seg' + (n < i ? ' done' : n === i ? ' active' : '');
        });
        label.textContent = text || STAGES[i].label;
      } else if (text) {
        label.textContent = text;
      }
      if (subtext) sub.textContent = subtext;
    },
    stop() { clearInterval(timer); panel.remove(); },
  };
}

/* -------------------------------------------- citation-aware rendering -- */
const CITE_RE = /\[([A-Za-z0-9_.\-]+\.(?:md|pdf))\]/g;

function renderAnswer(node, text) {
  node.textContent = '';
  let last = 0, m;
  CITE_RE.lastIndex = 0;
  while ((m = CITE_RE.exec(text)) !== null) {
    if (m.index > last) node.appendChild(document.createTextNode(text.slice(last, m.index)));
    node.appendChild(el('span', 'cite-inline', m[1]));
    last = m.index + m[0].length;
  }
  if (last < text.length) node.appendChild(document.createTextNode(text.slice(last)));
}

const FILE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';

function renderCitations(wrap, citations) {
  if (!citations || !citations.length) return;
  const box = el('div', 'cites');
  citations.forEach(c => {
    const chip = el('span', 'cite' + (c.status === 'superseded' ? ' sup' : ''));
    chip.innerHTML = FILE_ICON;
    chip.appendChild(document.createTextNode(
      c.doc_id + (c.status === 'superseded' ? ' · superseded' : '')));
    box.appendChild(chip);
  });
  wrap.appendChild(box);
}

/* ------------------------------------------------------- SSE parsing --- */
// sse_starlette terminates lines with CRLF, so frames are separated by
// "\r\n\r\n". Splitting on "\n\n" alone silently matches NOTHING and every
// answer looks truncated. Accept all three SSE line terminators.
const FRAME_SPLIT = /\r\n\r\n|\n\n|\r\r/;
const LINE_SPLIT = /\r\n|\n|\r/;

function parseFrame(frame) {
  let event = 'message', data = '';
  for (const line of frame.split(LINE_SPLIT)) {
    if (!line || line.startsWith(':')) continue;      // blank or ping comment
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).replace(/^ /, '');
  }
  if (!data) return null;
  try { return { event, payload: JSON.parse(data) }; } catch { return null; }
}

/* ----------------------------------------------------------- ask ------- */
async function ask(question) {
  question = (question || '').trim();
  if (busy || !question) return;

  busy = true;
  setSending(true);
  addMessage('You', true).body.textContent = question;

  const { wrap, body } = addMessage('Nodi Assistant', false);
  const think = makeThinking(wrap);

  let answer = '';
  let gotDone = false;
  let aborted = false;
  controller = new AbortController();

  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, conversation_id: conversationId }),
      signal: controller.signal,
    });
    if (!res.ok || !res.body) throw new Error('server returned HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const frames = buffer.split(FRAME_SPLIT);
      buffer = frames.pop();

      for (const raw of frames) {
        const parsed = parseFrame(raw);
        if (!parsed) continue;
        const { event, payload } = parsed;

        if (event === 'token') {
          if (think.panel.isConnected) think.stop();
          answer += payload.text;
          body.textContent = answer;
          const caret = el('span', 'caret');
          body.appendChild(caret);
          scrollDown();
        } else if (event === 'stage') {
          const s = payload.stage;
          if (s === 'reading') {
            think.setStage('reading', 'Reading ' + payload.sources + ' sources',
              (payload.documents || []).join(' · '));
          } else if (s === 'rewritten') {
            think.setStage('searching', 'Searching', 'Resolved to: ' + payload.query);
          } else if (s === 'degraded' || s === 'truncated') {
            wrap.appendChild(el('div', 'notice', payload.message));
          } else {
            think.setStage(s);
          }
        } else if (event === 'error') {
          gotDone = true;                 // an explicit error IS a final state
          think.stop();
          body.className = 'body err';
          body.textContent = payload.message || payload.code;
        } else if (event === 'done') {
          gotDone = true;
          think.stop();
          renderAnswer(body, answer);
          renderCitations(wrap, payload.citations);
          const t = payload.timings || {};
          if (t.total_s !== undefined) {
            const meta = el('div', 'meta');
            meta.appendChild(el('span', null, t.total_s + 's total'));
            if (t.prefill_s !== undefined) meta.appendChild(el('span', null, 'prefill ' + t.prefill_s + 's'));
            if (t.retrieve_s !== undefined) meta.appendChild(el('span', null, 'retrieval ' + t.retrieve_s + 's'));
            if (t.output_tokens) meta.appendChild(el('span', null, t.output_tokens + ' tokens'));
            wrap.appendChild(meta);
          }
          scrollDown();
        }
      }
    }
  } catch (err) {
    think.stop();
    if (err && err.name === 'AbortError') {
      aborted = true;
      gotDone = true;
      renderAnswer(body, answer);
      wrap.appendChild(el('div', 'notice', 'Stopped. The model was released.'));
    } else {
      body.className = 'body err';
      body.textContent = 'Could not reach the server: ' + (err && err.message ? err.message : err);
      gotDone = true;
    }
  }

  think.stop();
  const caret = body.querySelector('.caret');
  if (caret) caret.remove();

  // Plan M4.5 / R12: a stream that ends without a `done` frame is FAILED,
  // never a complete answer. A truncated reply that reads as confident is the
  // worst possible failure mode for a citation bot.
  if (!gotDone && !aborted) {
    renderAnswer(body, answer);
    wrap.appendChild(el('div', 'notice',
      'The connection ended before the answer finished, so this reply may be incomplete. Please ask again.'));
  }

  controller = null;
  busy = false;
  setSending(false);
  input.focus();
}

function setSending(on) {
  sendBtn.classList.toggle('stop', on);
  sendBtn.title = on ? 'Stop' : 'Send';
  sendBtn.innerHTML = on
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  sendBtn.disabled = !on && !input.value.trim();
}

/* ------------------------------------------------------------ wiring -- */
form.addEventListener('submit', e => {
  e.preventDefault();
  if (busy) { if (controller) controller.abort(); return; }
  const q = input.value;
  input.value = '';
  input.style.height = 'auto';
  ask(q);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 168) + 'px';
  if (!busy) sendBtn.disabled = !input.value.trim();
});

document.getElementById('reset').addEventListener('click', async () => {
  if (busy && controller) controller.abort();
  try {
    await fetch('/reset', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: '', conversation_id: conversationId }),
    });
  } catch {}
  conversationId = newId();
  log.innerHTML = '';
  hero.style.display = '';
  input.focus();
});

document.getElementById('theme').addEventListener('click', () => {
  const now = document.documentElement.getAttribute('data-theme');
  const dark = now ? now === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  try { localStorage.setItem('nodi-theme', dark ? 'light' : 'dark'); } catch {}
});
try {
  const saved = localStorage.getItem('nodi-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
} catch {}

const cards = document.getElementById('cards');
EXAMPLES.forEach(([text, why]) => {
  const b = el('button', 'card');
  b.type = 'button';
  b.appendChild(el('b', null, text));
  b.appendChild(el('span', null, why));
  b.addEventListener('click', () => ask(text));
  cards.appendChild(b);
});

fetch('/health').then(r => r.json()).then(h => {
  const dot = document.getElementById('statusdot');
  document.getElementById('pilltext').textContent =
    h.ok ? h.index.chunks + ' chunks indexed' : 'degraded';
  if (!h.ok) dot.classList.add('dot-bad');
  document.getElementById('sub').textContent =
    h.models.llm + ' · ' + h.models.embed + ' · local only';
}).catch(() => {
  document.getElementById('statusdot').classList.add('dot-bad');
  document.getElementById('pilltext').textContent = 'server unreachable';
  document.getElementById('sub').textContent = 'not connected';
});

setSending(false);
input.focus();
</script>
</body>
</html>
