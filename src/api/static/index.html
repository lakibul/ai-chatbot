<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodi Tech Assistant</title>
<style>
  /* No external fonts or CDNs anywhere: the project must work offline. */
  :root{
    --bg:#faf9f5; --side:#f0eee6; --raise:#ffffff; --bubble:#efece3;
    --ink:#262521; --ink-2:#4a4740; --muted:#736e64;
    --line:#e4e0d6; --line-2:#edeae1;
    --accent:#262521; --accent-ink:#faf9f5; --active:#e6e2d7;
    --warn:#8a6412; --warn-bg:#fbf4e4; --warn-line:#e6d6ae;
    --err:#8f2a33; --err-bg:#fbeeef; --err-line:#e8ccd0;
    --ok:#3f7d5c;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#262624; --side:#1d1d1b; --raise:#30302e; --bubble:#3a3a37;
      --ink:#f0eee6; --ink-2:#cfccc3; --muted:#948f85;
      --line:#3a3a37; --line-2:#323230;
      --accent:#f0eee6; --accent-ink:#262624; --active:#35352f;
      --warn:#d9b872; --warn-bg:#2c2518; --warn-line:#4a3f26;
      --err:#e8a0a8; --err-bg:#2e1b1d; --err-line:#4d2d31;
      --ok:#6cb892;
    }
  }
  :root[data-theme="dark"]{
    --bg:#262624; --side:#1d1d1b; --raise:#30302e; --bubble:#3a3a37;
    --ink:#f0eee6; --ink-2:#cfccc3; --muted:#948f85;
    --line:#3a3a37; --line-2:#323230;
    --accent:#f0eee6; --accent-ink:#262624; --active:#35352f;
    --warn:#d9b872; --warn-bg:#2c2518; --warn-line:#4a3f26;
    --err:#e8a0a8; --err-bg:#2e1b1d; --err-line:#4d2d31;
    --ok:#6cb892;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    font:15.5px/1.7 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,
         "Helvetica Neue",Arial,"Noto Sans Bengali",sans-serif;
    letter-spacing:-.003em; -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
  [hidden]{display:none !important;}

  .app{display:flex;height:100%;overflow:hidden;}

  /* ----------------------------------------------------------- sidebar  */
  .sidebar{
    width:262px;flex:none;background:var(--side);
    display:flex;flex-direction:column;min-height:0;
    border-right:1px solid var(--line);
  }
  .side-head{padding:15px 13px 8px;}
  .side-top{display:flex;align-items:center;gap:6px;padding:0 1px 12px;}
  .side-top .brand{flex:1;padding:0;}
  /* Collapse toggle: compact, but a full 34px hit target so it is easy to
     reach at the very top-left corner of the window. */
  .panelbtn{
    width:34px;height:34px;flex:none;display:grid;place-items:center;
    border:1px solid var(--line);background:var(--raise);color:var(--ink-2);
    border-radius:9px;cursor:pointer;
  }
  .panelbtn:hover{border-color:var(--muted);color:var(--ink);}
  .panelbtn svg{width:17px;height:17px;}
  /* Collapsed: the sidebar is removed on every width, and the same control
     reappears in the top bar so it can be brought back. */
  .app.nosidebar .sidebar{display:none;}
  .app.nosidebar #burger{display:grid;}
  .brand{
    display:flex;align-items:center;gap:9px;padding:0 5px 14px;
    font-size:13.5px;font-weight:600;letter-spacing:-.01em;
  }
  .brand i{
    width:21px;height:21px;border-radius:5px;flex:none;display:grid;
    place-items:center;background:var(--ink);color:var(--bg);
    font-size:10px;font-weight:700;font-style:normal;
  }
  .navbtn{
    width:100%;display:flex;align-items:center;gap:9px;
    background:transparent;border:1px solid transparent;color:var(--ink-2);
    border-radius:8px;padding:8px 11px;cursor:pointer;
    font-size:13.5px;font-weight:500;text-align:left;margin-bottom:3px;
  }
  .navbtn:hover{background:var(--active);color:var(--ink);}
  .navbtn.primary{border-color:var(--line);color:var(--ink);}
  .navbtn.primary:hover{background:var(--raise);border-color:var(--muted);}
  .navbtn.on{background:var(--active);color:var(--ink);font-weight:550;}
  .navbtn svg{width:15px;height:15px;opacity:.75;flex:none;}

  .convos{flex:1;overflow-y:auto;padding:4px 9px 14px;min-height:0;}
  .grouplabel{
    font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;
    text-transform:uppercase;padding:14px 8px 5px;
  }
  .convo{
    display:flex;align-items:center;gap:6px;width:100%;
    padding:7px 9px;border-radius:7px;cursor:pointer;
    border:0;background:transparent;text-align:left;
    font-size:13.5px;color:var(--ink-2);line-height:1.45;
  }
  .convo:hover{background:var(--active);}
  .convo.active{background:var(--active);color:var(--ink);font-weight:500;}
  .convo span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .convo .del{
    width:20px;height:20px;flex:none;border:0;background:transparent;
    color:var(--muted);border-radius:4px;cursor:pointer;display:none;place-items:center;
  }
  .convo:hover .del{display:grid;}
  .convo .del:hover{color:var(--err);}
  .convo .del svg{width:12px;height:12px;}
  .empty-note{font-size:12.5px;color:var(--muted);padding:12px 9px;}

  .side-foot{
    border-top:1px solid var(--line);padding:10px 16px;
    font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none;}
  .dot.bad{background:#b4454f;}

  /* -------------------------------------------------------------- main  */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
  .topbar{
    height:50px;flex:none;display:flex;align-items:center;gap:10px;
    padding:0 18px;border-bottom:1px solid transparent;
  }
  .topbar.scrolled{border-bottom-color:var(--line);}
  .topbar h1{
    font-size:14px;font-weight:550;margin:0;letter-spacing:-.01em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .grow{flex:1;}
  .ghost{
    width:30px;height:30px;display:grid;place-items:center;border-radius:7px;
    border:0;background:transparent;color:var(--muted);cursor:pointer;
  }
  .ghost:hover{background:var(--active);color:var(--ink);}
  .ghost svg{width:15px;height:15px;}
  #burger{display:none;}

  .scroll{flex:1;overflow-y:auto;min-height:0;}
  .thread{max-width:740px;margin:0 auto;padding:22px 28px 12px;}

  /* ------------------------------------------------------ home screen  */
  /* With no conversation open the composer moves into the centre of the
     page, under a title, instead of sitting pinned at the bottom. */
  .main.home .scroll{display:flex;flex-direction:column;justify-content:center;}
  .home-block{max-width:740px;margin:0 auto;width:100%;padding:0 28px 40px;}
  .home-title{
    display:flex;align-items:center;justify-content:center;gap:13px;
    margin:0 0 26px;font-size:30px;font-weight:450;letter-spacing:-.025em;
  }
  .home-title svg{width:27px;height:27px;flex:none;color:var(--muted);}
  .home-sub{text-align:center;color:var(--muted);font-size:14px;margin:-16px 0 26px;}
  #starters{margin-top:20px;}
  .starter{
    display:block;width:100%;text-align:left;background:transparent;
    border:0;border-top:1px solid var(--line-2);padding:11px 2px;cursor:pointer;
    font-size:14.5px;color:var(--ink-2);
  }
  .starter:last-child{border-bottom:1px solid var(--line-2);}
  .starter:hover{color:var(--ink);}

  /* ------------------------------------------------------------- turns  */
  .turn{display:flex;margin-bottom:28px;}
  .turn.user{justify-content:flex-end;}
  .bubble{min-width:0;}
  .turn.user .bubble{
    background:var(--bubble);border-radius:16px;padding:11px 16px;
    max-width:80%;color:var(--ink);
  }
  .turn.bot .bubble{max-width:100%;width:100%;}
  .text{white-space:pre-wrap;overflow-wrap:anywhere;}
  .text.err{
    background:var(--err-bg);border:1px solid var(--err-line);color:var(--err);
    border-radius:10px;padding:11px 13px;
  }
  .note{
    background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);
    border-radius:9px;padding:9px 12px;font-size:12.5px;margin-top:10px;
  }
  .caret{
    display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;
    background:var(--ink-2);opacity:.7;animation:blink 1.05s steps(2,start) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  .sources{margin-top:15px;font-size:12.5px;color:var(--muted);}
  .sources b{font-weight:600;color:var(--ink-2);margin-right:7px;}
  .src{color:var(--ink-2);}
  .src+.src::before{content:" · ";color:var(--muted);}
  .src.sup{color:var(--warn);}

  /* ------------------------------------------------- process inspector  */
  .proc{margin-top:13px;}
  .proc-bar{display:flex;align-items:center;gap:9px;}
  .ring{
    width:13px;height:13px;flex:none;border-radius:50%;
    border:1.5px solid var(--line);border-top-color:var(--muted);
    animation:spin .65s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .proc-label{font-size:14.5px;color:var(--muted);}
  .proc-clock{
    font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;
    margin-left:-3px;
  }
  .proc-done .proc-clock{display:none;}

  /* info tooltip in the sidebar footer */
  .info{
    position:relative;width:16px;height:16px;flex:none;display:grid;
    place-items:center;border:1px solid var(--line);border-radius:50%;
    background:transparent;color:var(--muted);cursor:help;font-size:9.5px;
    font-weight:700;line-height:1;padding:0;
  }
  .info:hover{color:var(--ink);border-color:var(--muted);}
  .info .tip{
    position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);
    width:238px;padding:9px 11px;border-radius:9px;z-index:60;
    background:var(--raise);border:1px solid var(--line);color:var(--ink-2);
    font-size:11.5px;font-weight:400;line-height:1.5;text-align:left;
    letter-spacing:0;cursor:default;
    box-shadow:0 6px 24px rgba(0,0,0,.18);
    opacity:0;visibility:hidden;transition:opacity .12s;
  }
  .info:hover .tip,.info:focus-visible .tip{opacity:1;visibility:visible;}
  .proc-done .proc-label{font-size:11.5px;}
  .proc-toggle{
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    background:transparent;border:1px solid var(--line);border-radius:999px;
    color:var(--muted);padding:3px 9px 3px 7px;font-size:11.5px;
  }
  .proc-toggle:hover{color:var(--ink);border-color:var(--muted);}
  .proc-toggle svg{width:12px;height:12px;flex:none;}
  .proc-toggle .chev{transition:transform .15s;}
  .proc-toggle[aria-expanded="true"] .chev{transform:rotate(180deg);}

  .steps{
    list-style:none;margin:11px 0 0;padding:11px 0 2px;
    border-top:1px solid var(--line-2);
  }
  .step{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:13px;}
  .step .mark{
    width:15px;height:15px;flex:none;margin-top:3px;border-radius:50%;
    display:grid;place-items:center;font-size:9px;
    border:1.5px solid var(--line);color:var(--muted);
  }
  .step.done .mark{border-color:var(--ok);color:var(--ok);}
  .step.live .mark{border-color:var(--muted);border-top-color:transparent;
                   animation:spin .65s linear infinite;}
  .step.pending{color:var(--muted);}
  .step.pending .mark{opacity:.5;}
  .step .body{flex:1;min-width:0;}
  .step .name{color:var(--ink-2);}
  .step.pending .name{color:var(--muted);}
  .step .detail{font-size:12px;color:var(--muted);margin-top:1px;
                overflow-wrap:anywhere;}
  .step .ms{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
            flex:none;margin-top:1px;}

  /* ---------------------------------------------------------- composer  */
  .composer-wrap{flex:none;padding:8px 28px 18px;}
  .main.home .composer-wrap{padding:0;}
  .composer{
    max-width:740px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;
    border:1px solid var(--line);border-radius:14px;background:var(--raise);
    padding:9px 9px 9px 16px;transition:border-color .12s;
  }
  .main.home .composer{padding:13px 11px 13px 18px;border-radius:16px;}
  .composer:focus-within{border-color:var(--muted);}
  textarea{
    flex:1;border:0;outline:0;resize:none;background:transparent;color:inherit;
    font:inherit;line-height:1.6;padding:6px 0;max-height:192px;min-height:26px;
  }
  textarea::placeholder{color:var(--muted);}
  .send{
    width:31px;height:31px;flex:none;border:0;border-radius:8px;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  }
  .send:disabled{opacity:.25;cursor:not-allowed;}
  .send svg{width:14px;height:14px;}
  .legal{max-width:740px;margin:8px auto 0;font-size:11px;color:var(--muted);text-align:center;}

  /* ------------------------------------------------------ architecture  */
  .arch{max-width:860px;margin:0 auto;padding:16px 28px 60px;}
  .arch h2{font-size:22px;font-weight:600;margin:14px 0 6px;letter-spacing:-.02em;}
  .arch h3{font-size:13px;font-weight:600;margin:34px 0 12px;color:var(--ink);
           letter-spacing:.03em;text-transform:uppercase;}
  .arch p{color:var(--ink-2);margin:0 0 14px;}
  .arch .lead{font-size:15.5px;}
  .arch table{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 10px;}
  .arch th{
    text-align:left;font-weight:600;font-size:11px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--muted);padding:0 10px 7px 0;
    border-bottom:1px solid var(--line);
  }
  .arch td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line-2);
           vertical-align:top;color:var(--ink-2);}
  .arch td b{color:var(--ink);font-weight:550;}
  .arch code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px;background:var(--active);padding:1px 5px;border-radius:4px;
  }
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 6px;}
  .stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .stat b{display:block;font-size:21px;font-weight:550;letter-spacing:-.02em;}
  .stat span{font-size:11.5px;color:var(--muted);}
  @media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr);}}

  /* flow diagram — plain boxes and rules, no drawing library */
  .flow{margin:0 0 6px;}
  .fbox{
    border:1px solid var(--line);border-radius:9px;padding:9px 13px;
    background:var(--raise);font-size:13px;color:var(--ink-2);
  }
  .fbox b{display:block;color:var(--ink);font-weight:550;font-size:13.5px;}
  .fbox small{color:var(--muted);font-size:11.5px;}
  .fbox.key{border-color:var(--muted);}
  .fbox.off{background:transparent;border-style:dashed;}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .farrow{
    height:20px;display:grid;place-items:center;color:var(--muted);
    font-size:11px;line-height:1;
  }
  .farrow::before{content:"↓";}
  .fnote{font-size:11.5px;color:var(--muted);padding:3px 2px 0;}
  .flane{
    font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);margin:26px 0 10px;
  }

  @media (max-width:860px){
    .sidebar{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);
             transition:transform .18s ease;}
    .sidebar.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35);}
    #burger{display:grid;}
    .thread,.composer,.legal,.arch,.home-block{max-width:none;}
    .thread,.arch{padding-left:18px;padding-right:18px;}
    .composer-wrap{padding-left:18px;padding-right:18px;}
    .home-block{padding-left:18px;padding-right:18px;}
    .turn.user .bubble{max-width:88%;}
    .home-title{font-size:24px;}
    .frow{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="side-top">
        <div class="brand"><i>N</i>Nodi Tech Assistant</div>
        <button class="panelbtn" id="sidetoggle" title="Hide sidebar" aria-label="Hide sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M10 4v16"/></svg>
        </button>
      </div>
      <button class="navbtn primary" id="newchat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New conversation
      </button>
      <button class="navbtn" id="navarch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="8.5" y="14" width="7" height="7" rx="1.5"/><path d="M6.5 10v2.5h11V10M12 12.5V14"/></svg>
        Architecture
      </button>
    </div>
    <nav class="convos" id="convos"></nav>
    <div class="side-foot">
      <i class="dot" id="dot"></i><span id="footstat">checking</span>
      <button class="info" id="infobtn" type="button" aria-label="What does this mean?">i
        <span class="tip" id="infotip"></span>
      </button>
    </div>
  </aside>

  <div class="main home" id="main">
    <div class="topbar" id="topbar">
      <button class="ghost" id="burger" aria-label="Conversations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 id="threadtitle"></h1>
      <span class="grow"></span>
      <button class="ghost" id="theme" aria-label="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </div>

    <div class="scroll" id="scroll">

      <!-- home -->
      <div class="home-block" id="homeblock">
        <h2 class="home-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9L4.9 19.1"/></svg>
          Nodi Tech Assistant
        </h2>
        <p class="home-sub">Answers from the company's internal documents, with sources.</p>
        <div id="composerslot"></div>
        <div id="starters"></div>
      </div>

      <!-- conversation -->
      <div class="thread" id="thread" hidden><div id="log"></div></div>

      <!-- architecture -->
      <div class="arch" id="arch" hidden></div>
    </div>

    <div class="composer-wrap" id="composerwrap">
      <form class="composer" id="form">
        <textarea id="q" rows="1" placeholder="How can I help you today?"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send"></button>
      </form>
      <div class="legal" id="legal">Answers are drawn from internal documents and may be incomplete. Verify anything consequential.</div>
    </div>
  </div>
</div>

<script>
'use strict';

const $ = id => document.getElementById(id);
const main=$('main'), log=$('log'), thread=$('thread'), homeblock=$('homeblock'),
      arch=$('arch'), scroll=$('scroll'), topbar=$('topbar'),
      form=$('form'), input=$('q'), sendBtn=$('send'), legal=$('legal'),
      composerWrap=$('composerwrap'), composerSlot=$('composerslot'),
      convosEl=$('convos'), threadTitle=$('threadtitle'), sidebar=$('sidebar');

let conversationId = newId();
let busy = false, controller = null, view = 'home';

function newId(){ return 'c-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function el(t,c,x){ const n=document.createElement(t); if(c)n.className=c; if(x!==undefined)n.textContent=x; return n; }
function atBottom(){ return scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 130; }
function down(force){ if(force||atBottom()) scroll.scrollTop = scroll.scrollHeight; }

const STARTERS = [
  'How many days of annual leave do I get?',
  'What does error ND-1042 mean?',
  'What is the hotel limit outside Dhaka?',
  'What time does the return office bus leave?',
  'অফিস বাস মিরপুর থেকে কখন ছাড়ে?',
];

const ICON_SEND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const ICON_STEPS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>';
const ICON_CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

scroll.addEventListener('scroll', () => {
  topbar.classList.toggle('scrolled', scroll.scrollTop > 4);
});

/* ------------------------------------------------------------- views -- */
/* The composer is MOVED in the DOM rather than duplicated: two inputs would
   mean two sources of truth for the draft text and the busy state. */
function setView(next){
  view = next;
  const home = next === 'home';
  main.classList.toggle('home', home);
  homeblock.hidden = !home;
  thread.hidden = next !== 'chat';
  arch.hidden = next !== 'arch';
  composerWrap.hidden = next === 'arch';
  legal.hidden = home;
  $('navarch').classList.toggle('on', next === 'arch');
  threadTitle.textContent = next === 'arch' ? 'Architecture'
                          : next === 'chat' ? threadTitle.dataset.title || '' : '';
  if(home) composerSlot.appendChild(composerWrap);
  else if(next === 'chat') main.appendChild(composerWrap);
  if(next !== 'arch') input.focus();
  scroll.scrollTop = 0;
}

function setTitle(t){ threadTitle.dataset.title = t; if(view==='chat') threadTitle.textContent = t; }

/* Filenames are an implementation detail. The model cites with
   [employee_handbook_v3.md]; the marker is removed from what the reader sees
   and the same documents are named underneath. A half-streamed
   "[employee_hand" is hidden too, so nothing flickers. */
function stripCitations(text){
  let t = text.replace(/\s*\[[^\[\]\n]*?\.(?:md|pdf)\]/gi, '');
  t = t.replace(/\s*\[[^\[\]\n]*$/, '');
  t = t.replace(/[ \t]+\n/g, '\n');
  t = t.replace(/\n*[ \t]*(sources?|citations?|references?)\s*:?\s*$/i, '');
  return t.replace(/\s+$/, '');
}

function addTurn(isUser){
  if(view !== 'chat') setView('chat');
  const turn = el('div','turn ' + (isUser ? 'user' : 'bot'));
  const bubble = el('div','bubble');
  bubble.appendChild(el('span','sr', isUser ? 'You said: ' : 'Assistant said: '));
  const text = el('div','text');
  bubble.appendChild(text);
  turn.appendChild(bubble);
  log.appendChild(turn);
  down(true);
  return {turn, bubble, text};
}

function renderSources(bubble, citations){
  if(!citations || !citations.length) return;
  const box = el('div','sources');
  box.appendChild(el('b', null, 'Sources'));
  citations.forEach(c => {
    const s = el('span','src' + (c.status==='superseded'?' sup':''));
    s.textContent = c.title + (c.status==='superseded' ? ' (superseded)' : '');
    box.appendChild(s);
  });
  bubble.appendChild(box);
}

/* ------------------------------------------------- process inspector --- */
/* Every answer carries its own step list: what finished, what is running,
   what has not started. Collapsed by default so it never competes with the
   answer; kept after completion so a slow reply can be explained rather
   than guessed at. */
const STEPS = [
  {key:'rewriting', name:'Understand the question'},
  {key:'searching', name:'Search documents'},
  {key:'reading',   name:'Review sources'},
  {key:'writing',   name:'Compose the answer'},
];

function makeProcess(bubble){
  const wrap = el('div','proc');
  const bar = el('div','proc-bar');
  const ring = el('div','ring');
  const label = el('div','proc-label','Starting');
  const clock = el('div','proc-clock','');
  const toggle = el('button','proc-toggle');
  toggle.type = 'button';
  toggle.setAttribute('aria-expanded','false');
  toggle.innerHTML = ICON_STEPS + '<span>Steps</span>' + ICON_CHEV;
  bar.appendChild(ring); bar.appendChild(label); bar.appendChild(clock);
  bar.appendChild(el('span','grow')); bar.appendChild(toggle);
  wrap.appendChild(bar);

  const list = el('ol','steps');
  list.hidden = true;
  const rows = STEPS.map(s => {
    const li = el('li','step pending');
    const mark = el('div','mark');
    const body = el('div','body');
    body.appendChild(el('div','name', s.name));
    const detail = el('div','detail'); detail.hidden = true;
    body.appendChild(detail);
    const ms = el('div','ms','');
    li.appendChild(mark); li.appendChild(body); li.appendChild(ms);
    list.appendChild(li);
    return {li, mark, detail, ms, started:0};
  });
  wrap.appendChild(list);
  bubble.appendChild(wrap);

  toggle.addEventListener('click', () => {
    const open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    list.hidden = open;
    down();
  });

  const t0 = performance.now();
  let current = -1;
  const timer = setInterval(() => {
    // Total elapsed, always visible while the answer is being produced.
    // On a 40-80s wait a moving number is the difference between "working"
    // and "hung".
    clock.textContent = '· ' + Math.round((performance.now() - t0)/1000) + 's';
    if(current >= 0 && rows[current].started){
      rows[current].ms.textContent =
        ((performance.now() - rows[current].started)/1000).toFixed(1) + 's';
    }
  }, 150);

  function finish(i){
    const r = rows[i];
    if(!r || !r.started) return;
    // Freeze the duration on first completion. Without this, finishing a
    // later step recomputes every earlier one from its own start to NOW, so
    // the first step inherits the elapsed time of the whole answer.
    if(r.li.classList.contains('done')) return;
    r.li.className = 'step done';
    r.mark.textContent = '✓';
    r.ms.textContent = ((performance.now() - r.started)/1000).toFixed(1) + 's';
  }

  return {
    wrap, list, toggle,
    enter(key){
      const i = STEPS.findIndex(s => s.key === key);
      // `<=`, not `<`: the server announces "writing" before generation
      // starts and the first token arrives much later. Re-entering the step
      // would restart its clock and throw away the prefill — which is the
      // part worth seeing, since it is most of the wait.
      if(i < 0 || i <= current) return;
      for(let n = 0; n <= current; n++) finish(n);
      current = i;
      rows[i].started = performance.now();
      rows[i].li.className = 'step live';
      label.textContent = STEPS[i].name;
    },
    detail(key, text){
      const i = STEPS.findIndex(s => s.key === key);
      if(i < 0) return;
      rows[i].detail.hidden = false;
      rows[i].detail.textContent = text;
    },
    skipRest(){
      rows.forEach((r,i) => { if(i > current && !r.started) r.li.remove(); });
    },
    complete(totalSeconds){
      clearInterval(timer);
      for(let n = 0; n <= current; n++) finish(n);
      rows.forEach(r => { if(!r.started) r.li.classList.add('pending'); });
      ring.remove();
      wrap.classList.add('proc-done');
      label.textContent = totalSeconds !== undefined
        ? 'Answered in ' + Math.round(totalSeconds) + ' seconds' : 'Finished';
    },
    fail(){ clearInterval(timer); ring.remove(); wrap.classList.add('proc-done');
            label.textContent = 'Stopped'; },
    removeIfTrivial(){ clearInterval(timer); wrap.remove(); },
  };
}

/* -------------------------------------------------------- SSE parsing -- */
/* sse_starlette terminates lines with CRLF, so frames are separated by
   "\r\n\r\n". Splitting on "\n\n" alone matches NOTHING and every answer
   looks truncated. Accept all three SSE terminators. */
const FRAME_SPLIT = /\r\n\r\n|\n\n|\r\r/;
const LINE_SPLIT = /\r\n|\n|\r/;

function parseFrame(frame){
  let event='message', data='';
  for(const line of frame.split(LINE_SPLIT)){
    if(!line || line.startsWith(':')) continue;
    if(line.startsWith('event:')) event = line.slice(6).trim();
    else if(line.startsWith('data:')) data += line.slice(5).replace(/^ /,'');
  }
  if(!data) return null;
  try{ return {event, payload: JSON.parse(data)}; }catch{ return null; }
}

/* -------------------------------------------------------------- ask ---- */
async function ask(question){
  question = (question||'').trim();
  if(busy || !question) return;
  busy = true; setSending(true);

  addTurn(true).text.textContent = question;
  if(!threadTitle.dataset.title){
    setTitle(question.length > 64 ? question.slice(0,63)+'…' : question);
  }

  const {bubble, text} = addTurn(false);
  const proc = makeProcess(bubble);
  const started = performance.now();

  let answer='', gotDone=false, aborted=false, sawStage=false;
  controller = new AbortController();

  try{
    const res = await fetch('/ask',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question, conversation_id: conversationId}),
      signal: controller.signal,
    });
    if(!res.ok || !res.body) throw new Error('server returned HTTP ' + res.status);

    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer='';
    for(;;){
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value,{stream:true});
      const frames = buffer.split(FRAME_SPLIT);
      buffer = frames.pop();

      for(const raw of frames){
        const parsed = parseFrame(raw);
        if(!parsed) continue;
        const {event, payload} = parsed;

        if(event === 'token'){
          proc.enter('writing');
          answer += payload.text;
          text.textContent = stripCitations(answer);
          text.appendChild(el('span','caret'));
          down();
        } else if(event === 'stage'){
          sawStage = true;
          const s = payload.stage;
          if(s === 'rewriting'){
            proc.enter('rewriting');
            proc.detail('rewriting', 'Resolving anything the question refers back to');
          } else if(s === 'rewritten'){
            proc.detail('rewriting', 'Rewritten as: “' + payload.query + '”');
          } else if(s === 'searching'){
            proc.enter('searching');
            proc.detail('searching', 'Keyword and meaning search over the indexed passages, then reranking');
          } else if(s === 'searched'){
            proc.detail('searching',
              payload.lexical + ' keyword matches and ' + payload.vector +
              ' meaning matches, fused to ' + payload.candidates + ' candidates, then ' +
              (payload.ranking === 'rerank' ? 'reranked' : 'ordered by fusion score'));
          } else if(s === 'reading'){
            proc.enter('reading');
            proc.detail('reading', payload.sources + ' passages chosen' +
              (payload.titles && payload.titles.length
                ? ' from: ' + payload.titles.join(', ') : ''));
          } else if(s === 'writing'){
            proc.enter('writing');
            proc.detail('writing', 'Reading the passages, then writing' +
              (payload.model ? ' · ' + payload.model : ''));
          } else if(s === 'degraded' || s === 'truncated'){
            bubble.appendChild(el('div','note', payload.message));
          } else {
            proc.enter(s);
          }
        } else if(event === 'error'){
          gotDone = true; proc.fail();
          text.className = 'text err';
          text.textContent = payload.message || payload.code;
        } else if(event === 'done'){
          gotDone = true;
          text.textContent = stripCitations(answer);
          renderSources(bubble, payload.citations);
          const t = payload.timings || {};
          const total = t.total_s !== undefined ? t.total_s
                      : (performance.now()-started)/1000;
          // An instant canned reply has no pipeline worth inspecting.
          if(!sawStage && total < 3) proc.removeIfTrivial();
          else {
            const bits = [];
            if(t.prompt_tokens) bits.push(t.prompt_tokens + ' tokens read');
            if(t.output_tokens) bits.push(t.output_tokens + ' written');
            if(t.prefill_s) bits.push(t.prefill_s + 's reading, ' +
                                      (t.generate_s || 0) + 's writing');
            if(bits.length) proc.detail('writing', bits.join(' · '));
            proc.skipRest(); proc.complete(total);
          }
          down();
        }
      }
    }
  }catch(err){
    if(err && err.name === 'AbortError'){
      aborted = true; gotDone = true;
      proc.fail();
      text.textContent = stripCitations(answer);
      bubble.appendChild(el('div','note','Stopped.'));
    }else{
      proc.fail();
      text.className = 'text err';
      text.textContent = 'Could not reach the server: ' + (err && err.message ? err.message : err);
      gotDone = true;
    }
  }

  const c = text.querySelector('.caret'); if(c) c.remove();

  /* A stream that ends without a `done` frame is FAILED, never a complete
     answer: a truncated reply that reads as confident is the worst possible
     failure mode for a citation-backed assistant. */
  if(!gotDone && !aborted){
    proc.fail();
    text.textContent = stripCitations(answer);
    bubble.appendChild(el('div','note',
      'The connection ended before the answer finished, so this reply may be incomplete.'));
  }

  controller = null; busy = false; setSending(false);
  refreshConversations();
  input.focus();
}

function setSending(on){
  sendBtn.innerHTML = on ? ICON_STOP : ICON_SEND;
  sendBtn.title = on ? 'Stop' : 'Send';
  sendBtn.disabled = !on && !input.value.trim();
}

/* ------------------------------------------------------- conversations -- */
function dayLabel(ts){
  const d = new Date(ts*1000), now = new Date();
  if(d.toDateString() === now.toDateString()) return 'Today';
  const y = new Date(now); y.setDate(now.getDate()-1);
  if(d.toDateString() === y.toDateString()) return 'Yesterday';
  if((now - d)/86400000 < 7) return 'Previous 7 days';
  return 'Earlier';
}

async function refreshConversations(){
  let list = [];
  try{
    const r = await fetch('/conversations');
    list = (await r.json()).conversations || [];
  }catch{ return; }

  convosEl.innerHTML = '';
  if(!list.length){
    convosEl.appendChild(el('div','empty-note','No conversations yet.'));
    return;
  }
  let group = '';
  list.forEach(c => {
    const g = dayLabel(c.updated_at);
    if(g !== group){ group = g; convosEl.appendChild(el('div','grouplabel', g)); }

    const row = el('button','convo' +
      (c.conversation_id === conversationId && view === 'chat' ? ' active' : ''));
    row.type = 'button';
    row.appendChild(el('span', null, c.title));

    const del = el('button','del');
    del.type = 'button'; del.title = 'Delete';
    del.innerHTML = ICON_TRASH;
    del.addEventListener('click', async ev => {
      ev.stopPropagation();
      try{ await fetch('/conversations/' + encodeURIComponent(c.conversation_id), {method:'DELETE'}); }catch{}
      if(c.conversation_id === conversationId) startNew();
      refreshConversations();
    });
    row.appendChild(del);
    row.addEventListener('click', () => openConversation(c.conversation_id, c.title));
    convosEl.appendChild(row);
  });
}

async function openConversation(id, title){
  if(busy && controller) controller.abort();
  let data;
  try{
    const r = await fetch('/conversations/' + encodeURIComponent(id));
    if(!r.ok) return;
    data = await r.json();
  }catch{ return; }

  conversationId = id;
  log.innerHTML = '';
  setView('chat');
  setTitle(title || data.title || 'Conversation');

  (data.turns || []).forEach(t => {
    const isUser = t.role === 'user';
    const {bubble, text} = addTurn(isUser);
    text.textContent = isUser ? t.content : stripCitations(t.content);
    if(!isUser) renderSources(bubble, t.citations);
  });

  sidebar.classList.remove('open');
  refreshConversations();
  down(true);
}

function startNew(){
  if(busy && controller) controller.abort();
  conversationId = newId();
  log.innerHTML = '';
  threadTitle.dataset.title = '';
  setView('home');
  sidebar.classList.remove('open');
  refreshConversations();
}

/* ------------------------------------------------------------- wiring -- */
form.addEventListener('submit', e => {
  e.preventDefault();
  if(busy){ if(controller) controller.abort(); return; }
  const q = input.value;
  input.value = ''; input.style.height = 'auto';
  ask(q);
});
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 192) + 'px';
  if(!busy) sendBtn.disabled = !input.value.trim();
});

$('newchat').addEventListener('click', () => { startNew(); input.focus(); });
$('navarch').addEventListener('click', () => {
  setView('arch');
  sidebar.classList.remove('open');
});
function setSidebar(hidden){
  document.querySelector('.app').classList.toggle('nosidebar', hidden);
  sidebar.classList.remove('open');
  try{ localStorage.setItem('nodi-sidebar', hidden ? 'hidden' : 'shown'); }catch{}
}
$('sidetoggle').addEventListener('click', () => setSidebar(true));
$('burger').addEventListener('click', () => {
  // Narrow screens slide the sidebar over the page; wide screens restore it.
  if(document.querySelector('.app').classList.contains('nosidebar')) setSidebar(false);
  else sidebar.classList.toggle('open');
});
try{
  if(localStorage.getItem('nodi-sidebar') === 'hidden') setSidebar(true);
}catch{}
$('theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('nodi-theme', next); }catch{}
});
try{
  const saved = localStorage.getItem('nodi-theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
}catch{}

const startersEl = $('starters');
STARTERS.forEach(t => {
  const b = el('button','starter', t); b.type='button';
  b.addEventListener('click', () => ask(t));
  startersEl.appendChild(b);
});

let health = null;
fetch('/health').then(r => r.json()).then(h => {
  health = h;
  $('footstat').textContent = h.ok ? h.index.chunks + ' passages indexed' : 'degraded';
  if(!h.ok) $('dot').classList.add('bad');
  $('infotip').textContent =
    'The company documents are split into ' + h.index.chunks + ' searchable ' +
    'passages — a section or a whole table each. Every question is answered ' +
    'only from these, never from the model’s own knowledge. Running ' +
    (h.models ? h.models.llm : 'a local model') + ' on this machine.';
}).catch(() => {
  $('dot').classList.add('bad');
  $('footstat').textContent = 'server unreachable';
  $('infotip').textContent = 'The assistant cannot reach its backend. ' +
    'Check that the server and Ollama are both running.';
});

setView('home');
setSending(false);
refreshConversations();
</script>
